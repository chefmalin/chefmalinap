<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#315b43">
  <title>NutriChef — Chargement</title>
  <link rel="icon" type="image/svg+xml" href="nutrichef-icon.svg">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#f4f0e3 0,#fcfbf7 58%);color:#25472c;font-family:system-ui,sans-serif}
    main{display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:24px}.welcome-pipo{display:block;width:clamp(215px,52vw,410px);height:auto;filter:drop-shadow(0 15px 18px rgb(49 91 67 / 18%));animation:welcome .9s ease-out both}.spinner{width:27px;height:27px;margin-top:4px;border:4px solid #dfe8d2;border-top-color:#315b43;border-radius:50%;animation:spin .8s linear infinite}.loading-error{margin:17px 0 0;color:#9e3f2d;font-size:14px;text-align:center}@keyframes spin{to{transform:rotate(360deg)}}@keyframes welcome{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.welcome-pipo,.spinner{animation:none}}
  </style>
</head>
<body>
  <main aria-label="Chargement de NutriChef"><img class="welcome-pipo" src="pipo-welcome-small.png" alt="Pipo vous souhaite la bienvenue"><span class="spinner" role="status" aria-label="Chargement"></span><p class="loading-error" hidden></p></main>
  <script>
    (async()=>{
      const parts=Array.from({length:23},(_,i)=>'nutrichef-source/part-'+String(i+1).padStart(2,'0')+'.txt');
      try{
        const responses=await Promise.all(parts.map(path=>fetch(path,{cache:'no-store'})));
        if(responses.some(response=>!response.ok))throw new Error('Une partie est indisponible');
        const html=(await Promise.all(responses.map(response=>response.text()))).join('');
        const enhancedHtml=html.replace('</head>','<link rel="stylesheet" href="nutrichef-responsive.css"></head>').replace('</body>','<script src="nutrichef-family-lite.js"></script></body>');
        document.open();document.write(enhancedHtml);document.close();
      }catch(error){const message=document.querySelector('.loading-error');message.hidden=false;message.textContent='Impossible de charger NutriChef. Actualisez la page dans quelques instants.';}
    })();
  </script>
</body>
</html>
