<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#315b43">
  <title>NutriChef — Chargement</title>
  <link rel="icon" type="image/svg+xml" href="nutrichef-icon.svg">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fcfbf7;color:#25472c;font-family:system-ui,sans-serif}
    main{text-align:center;padding:32px}.chef{font-size:70px;filter:drop-shadow(0 8px 14px #315b4330)}h1{font-family:Georgia,serif;font-size:clamp(31px,8vw,52px);margin:12px 0 8px}p{color:#637365}.bar{width:min(260px,80vw);height:11px;border-radius:99px;background:#e6ecd9;overflow:hidden;margin:25px auto}.bar i{display:block;width:42%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#315b43,#94b565);animation:load 1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(135%)}}
  </style>
</head>
<body>
  <main><div class="chef">👨‍🍳</div><h1>NutriChef</h1><p>Pipo prépare votre cuisine…</p><div class="bar"><i></i></div></main>
  <script>
    (async()=>{
      const parts=Array.from({length:23},(_,i)=>'nutrichef-source/part-'+String(i+1).padStart(2,'0')+'.txt');
      try{
        const responses=await Promise.all(parts.map(path=>fetch(path,{cache:'no-store'})));
        if(responses.some(response=>!response.ok))throw new Error('Une partie est indisponible');
        const html=(await Promise.all(responses.map(response=>response.text()))).join('');
        document.open();document.write(html);document.close();
      }catch(error){document.querySelector('p').textContent='Impossible de charger NutriChef. Actualisez la page dans quelques instants.';}
    })();
  </script>
</body>
</html>
