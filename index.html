<style id="nutrichef-week-and-budget-style">
/* Accueil : une seule action claire, centrée sous la bannière. */
.home-week-row {
  display: flex;
  justify-content: center;
  margin: 18px 0 24px;
}
.week-cta-full {
  width: min(100%, 700px);
  min-height: 66px;
  padding: 14px 28px;
  border: 2px solid #f2b739;
  border-bottom-width: 7px;
  border-radius: 18px;
  background: linear-gradient(145deg, #43845d, #24583d);
  box-shadow: 0 7px 0 #c98d12, 0 14px 24px rgb(29 71 46 / 18%);
  color: #fff;
  font-size: 17px;
  font-weight: 850;
  line-height: 1;
  text-align: center;
}
.week-cta-full:hover {
  background: linear-gradient(145deg, #4b9167, #2b6546);
  box-shadow: 0 4px 0 #c98d12, 0 10px 18px rgb(29 71 46 / 18%);
  transform: translateY(3px);
}
.week-cta-full .week-calendar { font-size: 22px; }
.week-cta-full .week-pipo {
  width: 31px;
  height: 31px;
  object-fit: cover;
  object-position: 50% 18%;
  border: 2px solid #fff8df;
  border-radius: 50%;
  background: #eff3e2;
}

/* Courses : accès au suivi du ticket de caisse. */
.shopping-budget-callout {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  margin-top: 17px;
  padding: 18px 20px;
  border: 1px solid #dbe6cf;
  border-radius: 21px;
  background: linear-gradient(135deg, #f2f7ea, #fffaf1);
}
.shopping-budget-callout h2 { margin: 0 0 4px; color: #315b43; font-size: 22px; }
.shopping-budget-callout p { margin: 0; color: #627066; font-size: 13px; }
.shopping-budget-button {
  flex: 0 0 auto;
  min-height: 54px;
  padding: 10px 16px;
  border: 2px solid #f2b739;
  border-bottom-width: 6px;
  border-radius: 16px;
  background: #315b43;
  color: #fff;
  box-shadow: 0 5px 0 #c98d12;
  font-weight: 850;
  text-decoration: none;
}
.shopping-budget-button:hover { color: #fff; transform: translateY(2px); box-shadow: 0 3px 0 #c98d12; }
.shopping-budget-button img { width: 30px; height: 30px; margin-right: 7px; vertical-align: middle; object-fit: cover; object-position: 50% 18%; border-radius: 50%; background: #eff3e2; }

/* Page « Le chef calcule ». */
.budget-shell { max-width: 900px; }
.budget-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
.budget-heading h1 { margin-bottom: 6px; }
.budget-pipo { width: 104px; height: 104px; object-fit: contain; filter: drop-shadow(0 8px 12px rgb(29 71 46 / 16%)); }
.budget-total-card {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 16px;
  margin-bottom: 18px;
  padding: 20px 22px;
  border: 1px solid #d7e4ca;
  border-radius: 22px;
  background: #eff6e8;
}
.budget-total-card p { margin: 0; color: #5f6e64; font-size: 13px; }
.budget-total-card strong { color: #214d36; font-family: Georgia, serif; font-size: clamp(31px, 5vw, 48px); }
.budget-photo-card, .budget-lines-card { margin-bottom: 18px; padding: 20px; border: 1px solid #e2e7dc; border-radius: 20px; background: #fffefa; }
.budget-photo-card h2, .budget-lines-card h2 { margin: 0 0 6px; font-size: 22px; }
.budget-help { margin: 0 0 16px; color: #68756c; font-size: 13px; line-height: 1.55; }
.budget-photo-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.budget-photo-button { cursor: pointer; }
.budget-photo-button input { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; }
.budget-photo-preview { display: none; width: min(100%, 330px); max-height: 250px; margin-top: 16px; border: 1px solid #dbe4d1; border-radius: 14px; object-fit: contain; background: #f5f2e9; }
.budget-ocr-status { margin: 14px 0 0; color: #596a5e; font-size: 13px; }
.budget-ocr-result { margin-top: 13px; padding: 12px 14px; border-radius: 13px; background: #f5f1df; color: #455748; font-size: 13px; }
.budget-ticket-total { display: grid; grid-template-columns: 1fr minmax(135px, 190px); gap: 12px; align-items: end; margin: 17px 0 0; }
.budget-ticket-total label { margin: 0; }
.budget-price-list { display: grid; gap: 9px; margin-top: 15px; }
.budget-price-line { display: grid; grid-template-columns: minmax(0, 1fr) 130px; align-items: center; gap: 14px; padding: 11px 12px; border-radius: 13px; background: #f7f9f3; }
.budget-price-line span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.budget-price-line label { margin: 0; color: #6b786f; font-size: 11px; }
.budget-price-line input { margin-top: 4px; padding: 8px 9px; }
.budget-empty { margin: 12px 0 0; color: #6a756d; }
.budget-back { margin-top: 6px; }
@media (max-width: 700px) {
  .home-week-row { margin: 14px 0 21px; }
  .week-cta-full { min-height: 60px; padding: 12px 17px; border-bottom-width: 6px; font-size: 15px; }
  .week-cta-full .week-calendar { font-size: 20px; }
  .week-cta-full .week-pipo { width: 27px; height: 27px; }
  .shopping-budget-callout { align-items: stretch; flex-direction: column; }
  .shopping-budget-button { width: 100%; text-align: center; }
  .budget-heading { gap: 10px; }
  .budget-pipo { width: 78px; height: 78px; }
  .budget-total-card { grid-template-columns: 1fr; }
  .budget-ticket-total { grid-template-columns: 1fr; }
  .budget-price-line { grid-template-columns: minmax(0, 1fr) 118px; gap: 10px; }
}
</style></style><link rel="stylesheet" href="nutrichef-profile-clarity.css">

function chart(){const points=[...state.weights].sort((a,b)=>a.date.localeCompare(b.date)).slice(-16);if(!points.length)return'<p>Aucune pesée enregistrée.</p>';const lo=Math.min(...points.map(p=>p.weight))-1,hi=Math.max(...points.map(p=>p.weight))+1;const xy=points.map((p,i)=>[45+i*450/Math.max(1,points.length-1),160-(p.weight-lo)/(hi-lo)*125]);return`<svg class="chart" viewBox="0 0 530 205" role="img" aria-label="Évolution du poids ; valeurs détaillées dans le tableau"><path d="M45 20V165H510" fill="none" stroke="#d7ddcc"/><text x="0" y="38">${fmt(hi)} kg</text><text x="0" y="163">${fmt(lo)} kg</text><polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#5f8347" stroke-width="3"/>${xy.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="5" fill="#5f8347"><title>${points[i].date} : ${points[i].weight} kg</title></circle>`).join('')}<text x="45" y="195">${pretty(points[0].date)}</text><text x="440" y="195">${pretty(points.at(-1).date)}</text></svg>`;}

/* Actions légères ajoutées à l'accueil et à la liste de courses. */
(() => {
  'use strict';
  let photoUrl = '';
  let ocrLoader;

  const money = value => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(Number(value || 0));
  const safe = value => typeof esc === 'function' ? esc(String(value ?? '')) : String(value ?? '');
  const budget = () => {
    state.shoppingBudget ??= { prices: {}, ticketTotal: null, ticketDate: null };
    state.shoppingBudget.prices ??= {};
    return state.shoppingBudget;
  };
  const price = item => Number(budget().prices[item.id]) || 0;
  const itemTotal = () => (state.shopping || []).reduce((sum, item) => sum + price(item), 0);
  const savedTotal = () => {
    const total = Number(budget().ticketTotal);
    return Number.isFinite(total) && total > 0 ? total : itemTotal();
  };
  const saveBudget = () => { budget(); save(); };

  function budgetPage() {
    const items = state.shopping || [];
    const b = budget();
    const lines = items.map(item => `<div class="budget-price-line"><span title="${safe(item.name)}">${safe(item.name)}</span><label>Prix payé<input inputmode="decimal" type="number" min="0" max="999.99" step="0.01" placeholder="0,00" value="${price(item) || ''}" data-nc-price-id="${safe(item.id)}" aria-label="Prix payé pour ${safe(item.name)}"></label></div>`).join('');
    const applied = Number(b.ticketTotal) > 0;
    return `<div class="wrap budget-shell"><section class="budget-heading"><div><div class="eyebrow">Le ticket de caisse, sans calcul mental</div><h1>Le chef calcule</h1><p class="muted">Prenez votre ticket en photo, vérifiez le total, puis gardez-le ici avec votre liste.</p></div><img class="budget-pipo" src="nutrichef-assets-v2/image-01.png" alt="Pipo avec sa calculatrice"></section><section class="budget-total-card"><div><p>${applied ? 'Dernier total enregistré' : 'Total des prix renseignés'}</p><strong id="nc-budget-total">${money(savedTotal())}</strong><p id="nc-budget-total-help">${applied ? 'Le total du ticket est conservé sur cet appareil.' : 'Ajoutez les prix ci-dessous, ou laissez Pipo lire le ticket.'}</p></div><span aria-hidden="true" style="font-size:44px">🧮</span></section><section class="budget-photo-card"><h2>Photographier le ticket</h2><p class="budget-help">Depuis un téléphone, le bouton ouvre directement l’appareil photo. La lecture se fait dans le navigateur et le total proposé doit toujours être vérifié.</p><div class="budget-photo-actions"><label class="btn budget-photo-button">📷 Prendre ou ajouter une photo<input id="nc-receipt-photo" type="file" accept="image/*" capture="environment"></label><button type="button" class="secondary" data-nc-action="clear-ticket-total" ${applied ? '' : 'disabled'}>Effacer le total</button></div><img id="nc-receipt-preview" class="budget-photo-preview" alt="Aperçu du ticket de caisse"><p id="nc-ocr-status" class="budget-ocr-status" aria-live="polite">Aucune photo analysée pour le moment.</p><div id="nc-ocr-result"></div><div class="budget-ticket-total"><label>Montant total du ticket<input id="nc-ticket-total" inputmode="decimal" type="number" min="0" max="9999.99" step="0.01" placeholder="Ex. 42,70" value="${applied ? Number(b.ticketTotal).toFixed(2) : ''}"></label><button type="button" data-nc-action="save-ticket-total">Enregistrer ce total</button></div></section><section class="budget-lines-card"><h2>Prix article par article</h2><p class="budget-help">Vous pouvez corriger ou compléter chaque prix : le total se met à jour et reste enregistré sur cet appareil.</p><div class="budget-price-list">${lines || '<p class="budget-empty">Ajoutez d’abord des produits à votre liste de courses.</p>'}</div></section><a class="btn secondary budget-back" href="#courses">← Revenir à ma liste de courses</a></div>`;
  }

  function replaceHomeIntro() {
    const intro = document.querySelector('#app .wrap > .intro');
    if (!intro || intro.dataset.ncReplaced) return;
    const oldLink = intro.querySelector('.week-cta');
    const href = oldLink?.getAttribute('href') || '#calendrier';
    intro.dataset.ncReplaced = 'true';
    intro.outerHTML = `<div class="home-week-row"><a class="btn week-cta week-cta-full" href="${href}"><span class="week-calendar" aria-hidden="true">🗓️</span><span>Organiser ma semaine</span><img class="week-pipo" src="nutrichef-assets-v2/image-01.png" alt=""></a></div>`;
  }

  function addBudgetCallout() {
    const exportBox = document.querySelector('#app .shopping-export');
    if (!exportBox || document.querySelector('.shopping-budget-callout')) return;
    const callout = document.createElement('section');
    callout.className = 'shopping-budget-callout';
    callout.innerHTML = `<div><h2>Le chef calcule</h2><p>Photographiez votre ticket, gardez le total de vos courses et vérifiez les prix avec Pipo.</p></div><a class="shopping-budget-button" href="#budget"><img src="nutrichef-assets-v2/image-01.png" alt="">🧮 Le chef calcule</a>`;
    exportBox.insertAdjacentElement('afterend', callout);
  }

  function mount() {
    const route = location.hash.slice(1) || 'accueil';
    const app = document.querySelector('#app');
    if (!app) return;
    if (route === 'budget') {
      app.innerHTML = budgetPage();
      document.title = 'NutriChef · Le chef calcule';
      return;
    }
    if (route === 'accueil') replaceHomeIntro();
    if (route === 'courses') addBudgetCallout();
  }

  function extractTotal(text) {
    const amount = line => [...line.matchAll(/(?:^|[^0-9])(\d{1,4}(?:[ .]\d{3})*[,.]\d{2})(?:\s*(?:€|eur))?/gi)].map(match => Number(match[1].replace(/[ .]/g, '').replace(',', '.'))).filter(value => Number.isFinite(value) && value >= 0 && value < 10000);
    const lines = String(text || '').split(/\r?\n/);
    const marked = lines.filter(line => /total|a\s*payer|montant|somme/i.test(line)).flatMap(amount);
    const all = lines.flatMap(amount);
    return marked.at(-1) ?? all.at(-1) ?? null;
  }

  function loadOcr() {
    if (window.Tesseract) return Promise.resolve(window.Tesseract);
    if (ocrLoader) return ocrLoader;
    ocrLoader = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      script.async = true;
      script.onload = () => window.Tesseract ? resolve(window.Tesseract) : reject(new Error('Bibliothèque indisponible'));
      script.onerror = () => reject(new Error('Chargement impossible'));
      document.head.appendChild(script);
    });
    return ocrLoader;
  }

  async function readPhoto(file) {
    const status = document.querySelector('#nc-ocr-status');
    const result = document.querySelector('#nc-ocr-result');
    const preview = document.querySelector('#nc-receipt-preview');
    if (!file || !status || !result || !preview) return;
    if (photoUrl) URL.revokeObjectURL(photoUrl);
    photoUrl = URL.createObjectURL(file);
    preview.src = photoUrl;
    preview.style.display = 'block';
    status.textContent = 'Pipo lit les montants du ticket…';
    result.innerHTML = '';
    try {
      const Tesseract = await loadOcr();
      const { data } = await Tesseract.recognize(file, 'fra+eng', { logger: message => {
        if (message.status === 'recognizing text' && Number.isFinite(message.progress)) status.textContent = `Pipo lit le ticket… ${Math.round(message.progress * 100)} %`;
      }});
      const total = extractTotal(data.text);
      if (total === null) {
        status.textContent = 'Pipo n’a pas trouvé de total lisible.';
        result.innerHTML = '<div class="budget-ocr-result">Vous pouvez tout de même inscrire le montant final manuellement ci-dessous.</div>';
        return;
      }
      document.querySelector('#nc-ticket-total').value = total.toFixed(2);
      status.textContent = 'Un total a été proposé : vérifiez-le avant de l’enregistrer.';
      result.innerHTML = `<div class="budget-ocr-result"><strong>Total détecté : ${money(total)}</strong><br>Le montant a été placé dans le champ ci-dessous. Il n’est conservé qu’après votre confirmation.</div>`;
    } catch {
      status.textContent = 'La lecture automatique est indisponible pour cette photo.';
      result.innerHTML = '<div class="budget-ocr-result">Pas de souci : saisissez le montant final manuellement, puis enregistrez-le.</div>';
    }
  }

  document.addEventListener('click', event => {
    const action = event.target.closest('[data-nc-action]')?.dataset.ncAction;
    if (!action) return;
    if (action === 'save-ticket-total') {
      const field = document.querySelector('#nc-ticket-total');
      const value = Number(field?.value);
      if (!Number.isFinite(value) || value <= 0) { toast('Ajoutez un montant supérieur à zéro.'); return; }
      budget().ticketTotal = value;
      budget().ticketDate = new Date().toISOString();
      saveBudget();
      mount();
      toast('Le total de vos courses est enregistré.');
    }
    if (action === 'clear-ticket-total') {
      budget().ticketTotal = null;
      budget().ticketDate = null;
      saveBudget();
      mount();
      toast('Le total enregistré a été effacé.');
    }
  });

  document.addEventListener('input', event => {
    const input = event.target;
    if (!input.matches('[data-nc-price-id]')) return;
    const value = Number(input.value);
    budget().prices[input.dataset.ncPriceId] = Number.isFinite(value) && value >= 0 ? value : 0;
    budget().ticketTotal = null;
    saveBudget();
    const total = document.querySelector('#nc-budget-total');
    const help = document.querySelector('#nc-budget-total-help');
    if (total) total.textContent = money(itemTotal());
    if (help) help.textContent = 'Total des prix renseignés, enregistré sur cet appareil.';
  });

  document.addEventListener('change', event => {
    if (event.target.id === 'nc-receipt-photo') readPhoto(event.target.files?.[0]);
  });

  window.addEventListener('hashchange', () => setTimeout(mount, 0));
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(mount, 0), { once: true });
  else setTimeout(mount, 0);
})();
</script>

<script id="nutrichef-week-budget-fix-script">

(() => {
  'use strict';
  let receiptUrl = '';
  let ocrPromise;
  const storageKey = () => window.NUTRICHEF_STORAGE_KEY || 'nutrichef-v3';
  const formatMoney = value => new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR' }).format(Number(value || 0));
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[char]);
  const toNumber = value => Number(String(value ?? '').trim().replace(',', '.'));
  const idFor = item => String(item?.id ?? item?.name ?? 'article');

    catch { return {}; }

  function writeData(data) {
    try { localStorage.setItem(storageKey(), JSON.stringify(data)); return true; }
    catch { return false; }
  }
  function dataWithBudget() {
    const data = readData();

    if (!data.shoppingBudget.prices || typeof data.shoppingBudget.prices !== 'object') data.shoppingBudget.prices = {};

  }
  function priceFor(data, item) { const value = toNumber(data.shoppingBudget.prices[idFor(item)]); return Number.isFinite(value) && value >= 0 ? value : 0; }

      return `<div class="budget-price-line"><span title="${name}">${name}</span><label>Prix payé<input data-nc-fixed-price="${key}" inputmode="decimal" type="number" min="0" max="999.99" step="0.01" placeholder="0,00" value="${value || ''}" aria-label="Prix payé pour ${name}"></label></div>`;
    }).join('');

nes-card"><h2>Prix article par article</h2><p class="budget-help">Vous pouvez corriger ou compléter chaque prix : le total se met à jour et reste enregistré sur cet appareil.</p><div class="budget-price-list">${lines || '<p class="budget-empty">Ajoutez d’abord des produits à votre liste de courses.</p>'}</div></section><a class="btn secondary budget-back" href="#courses">← Revenir à ma liste de courses</a></div>`;
  }
  function weekButton() {

  }
  function fixHome() {

    if (row) row.innerHTML = weekButton();
  }
  function chefButton() {
    return `<section class="shopping-budget-action"><a class="shopping-budget-button" href="#budget"><img src="assets/pipo-calculatrice-button.png" alt="Pipo tenant une calculatrice"><span>Le chef calcule</span></a></section>`;
  }
  function fixCourses() {
    const old = document.querySelector('#app .shopping-budget-callout');
    if (old) { old.outerHTML = chefButton(); return; }

  function findTotal(text) {
    const amounts = line => [...String(line).matchAll(/(?:^|[^0-9])(\d{1,4}(?:[ .]\d{3})*[,.]\d{2})(?:\s*(?:€|eur))?/gi)].map(match => toNumber(match[1].replace(/[ .]/g, ''))).filter(value => Number.isFinite(value) && value >= 0 && value < 10000);

  }
  async function readReceipt(file) {
    const status = document.getElementById('nc-fixed-ocr-status'); const result = document.getElementById('nc-fixed-ocr-result'); const preview = document.getElementById('nc-fixed-receipt-preview');

<script id="nutrichef-budget-calendar-script">
/* Suivi mensuel des courses : données conservées uniquement dans le navigateur de l'utilisateur. */
(() => {
  'use strict';
  let shownMonth = monthKey(new Date());
  let ocrLoader;
  const storeKey = () => window.NUTRICHEF_STORAGE_KEY || 'nutrichef-v3';
  const euro = value => new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR' }).format(Number(value || 0));
  const number = value => Number(String(value ?? '').trim().replace(',', '.'));
  function dayKey(date = new Date()) { return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`; }
  function monthKey(date) { return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`; }
  function parseDay(key) { return new Date(`${key}T12:00:00`); }
  function monthName(key) { return new Intl.DateTimeFormat('fr-FR', { month:'long', year:'numeric' }).format(new Date(`${key}-01T12:00:00`)); }
  function dayName(key) { return new Intl.DateTimeFormat('fr-FR', { weekday:'long', day:'numeric', month:'long' }).format(parseDay(key)); }
  function readRoot() { try { const value = JSON.parse(localStorage.getItem(storeKey()) || '{}'); return value && typeof value === 'object' ? value : {}; } catch { return {}; } }
  function writeRoot(root) { try { localStorage.setItem(storeKey(), JSON.stringify(root)); return true; } catch { return false; } }
  function tracker() {
    const root = readRoot();
    if (!root.shoppingBudget || typeof root.shoppingBudget !== 'object') root.shoppingBudget = {};
    const data = root.shoppingBudget;
    if (!Array.isArray(data.records)) data.records = [];
    if (!data.monthlyTargets || typeof data.monthlyTargets !== 'object') data.monthlyTargets = {};
    const oldTotal = number(data.ticketTotal);
    if (!data.calendarMigrated && Number.isFinite(oldTotal) && oldTotal > 0) { data.records.push({ id:`ancien-${Date.now()}`, date:(data.ticketDate || new Date().toISOString()).slice(0, 10), amount:oldTotal }); data.calendarMigrated = true; }
    return { root, data };
  }
  function recordsFor(data, key) { return data.records.filter(record => /^\d{4}-\d{2}-\d{2}$/.test(record.date || '') && record.date.slice(0, 7) === key && Number(record.amount) > 0); }

  function weekStart(date) { const copy = new Date(date); copy.setHours(12, 0, 0, 0); copy.setDate(copy.getDate() - ((copy.getDay() + 6) % 7)); return dayKey(copy); }

    const [year, month] = key.split('-').map(Number); const first = new Date(year, month - 1, 1); const days = new Date(year, month, 0).getDate(); const leading = (first.getDay() + 6) % 7; const total = Math.ceil((leading + days) / 7) * 7; const today = dayKey(); let html = '';
    for (let index = 0; index < total; index += 1) { const day = index - leading + 1; if (day < 1 || day > days) { html += '<div class="budget-day empty" aria-hidden="true"></div>'; continue; } const date = `${key}-${String(day).padStart(2, '0')}`; const amount = dayAmount(records, date); html += `<div class="budget-day ${date === today ? 'today' : ''}" title="${dayName(date)}"><time datetime="${date}">${day}</time>${amount ? `<span class="budget-day-amount">${euro(amount)}</span>` : ''}</div>`; }
    return html;
  }
  function page() {
    const { data } = tracker(); const records = recordsFor(data, shownMonth); const spent = sum(records); const target = number(data.monthlyTargets[shownMonth]); const hasTarget = Number.isFinite(target) && target > 0; const progress = hasTarget ? Math.min(100, Math.round((spent / target) * 100)) : 0; const remaining = hasTarget ? target - spent : 0; const thisWeek = currentWeekTotal(data);
    const history = [...records].sort((a, b) => b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id))).map(record => `<div class="budget-history-row"><time datetime="${record.date}">${dayName(record.date)}</time><strong>${euro(record.amount)}</strong><button class="budget-delete" type="button" data-nc-tracker-delete="${String(record.id).replace(/&/g, '&amp;').replace(/"/g, '&quot;')}" aria-label="Supprimer la dépense du ${dayName(record.date)}">×</button></div>`).join('');
    return `<div class="wrap budget-calendar-shell"><header class="budget-calendar-header"><div><h1>Le chef calcule</h1><p class="muted">Suivez vos courses mois après mois, sans perdre le fil.</p></div><img class="budget-calendar-pipo" src="assets/pipo-calculatrice-button.png" alt="Pipo tenant une calculatrice"></header><div class="budget-month-switcher"><button type="button" class="secondary" data-nc-tracker-action="previous" aria-label="Mois précédent">‹</button><h2>${monthName(shownMonth)}</h2><button type="button" class="secondary" data-nc-tracker-action="next" aria-label="Mois suivant">›</button></div><section class="budget-overview"><div class="budget-target-card"><h3>Mon budget courses</h3><p>Choisissez votre objectif pour le mois. Il reste modifiable à tout moment.</p><div class="budget-target-input"><label>Budget de ${monthName(shownMonth)}<input id="nc-tracker-target" inputmode="decimal" type="number" min="0" max="9999" step="1" placeholder="Ex. 400" value="${hasTarget ? target : ''}"></label><span>€ / mois</span></div><a class="btn secondary budget-list-link" href="#courses">Voir ma liste de courses</a></div><div class="budget-ring-card"><div class="budget-ring" style="--progress:${progress}%"><div><strong>${progress}%</strong><span>du budget</span></div></div><div class="budget-ring-copy"><strong>${euro(spent)}</strong><span>dépensés ce mois</span><span>${hasTarget ? (remaining >= 0 ? `${euro(remaining)} restants` : `${euro(Math.abs(remaining))} au-dessus`) : 'Ajoutez un budget mensuel'}</span><span>Cette semaine : ${euro(thisWeek)}</span></div></div></section><section class="budget-add-card"><div class="budget-add-top"><div><h2>Ajouter mes courses</h2><p>Ajoutez le total d’un ticket à la date de vos courses. La photo peut préremplir le montant, que vous vérifiez ensuite.</p></div><label class="btn budget-photo-mini">Prendre une photo<input id="nc-tracker-photo" type="file" accept="image/*" capture="environment"></label></div><p id="nc-tracker-photo-status" class="budget-photo-status" aria-live="polite"></p><div class="budget-add-grid"><label>Date des courses<input id="nc-tracker-date" type="date" value="${dayKey()}" max="2100-12-31"></label><label>Total du ticket<input id="nc-tracker-amount" inputmode="decimal" type="number" min="0.01" max="9999.99" step="0.01" placeholder="Ex. 90,00"></label><button type="button" data-nc-tracker-action="add">Enregistrer mes courses</button></div></section><section class="budget-calendar-card"><div class="budget-calendar-weekdays"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div><div class="budget-calendar-grid">${calendarCells(shownMonth, records)}</div></section><section class="budget-history-card"><h2>Mes courses du mois</h2><p>Chaque total est enregistré à sa date pour garder une vue claire de vos dépenses.</p><div class="budget-history-list">${history || '<p class="budget-empty-history">Aucune course enregistrée pour ce mois.</p>'}</div></section></div>`;
  }
  function mount() { if ((location.hash.slice(1) || 'accueil') !== 'budget') return; const app = document.getElementById('app'); if (!app) return; app.innerHTML = page(); document.title = 'NutriChef · Le chef calcule'; window.scrollTo(0, 0); }
  function getOcr() { if (window.Tesseract) return Promise.resolve(window.Tesseract); if (ocrLoader) return ocrLoader; ocrLoader = new Promise((resolve, reject) => { const script = document.createElement('script'); script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'; script.async = true; script.onload = () => window.Tesseract ? resolve(window.Tesseract) : reject(new Error('indisponible')); script.onerror = () => reject(new Error('chargement impossible')); document.head.appendChild(script); }); return ocrLoader; }
  function detectedTotal(text) { const values = [...String(text || '').matchAll(/(?:^|[^0-9])(\d{1,4}(?:[ .]\d{3})*[,.]\d{2})(?:\s*(?:€|eur))?/gi)].map(match => number(match[1].replace(/[ .]/g, ''))).filter(value => Number.isFinite(value) && value >= 0 && value < 10000); return values.at(-1) ?? null; }
  async function readPhoto(file) { const status = document.getElementById('nc-tracker-photo-status'); if (!file || !status) return; status.textContent = 'Pipo lit le ticket…'; try { const Tesseract = await getOcr(); const { data } = await Tesseract.recognize(file, 'fra+eng', { logger: message => { if (message.status === 'recognizing text' && Number.isFinite(message.progress)) status.textContent = `Pipo lit le ticket… ${Math.round(message.progress * 100)} %`; } }); const total = detectedTotal(data.text); if (total === null) { status.textContent = 'Total non détecté : vous pouvez le saisir manuellement.'; return; } const amount = document.getElementById('nc-tracker-amount'); if (amount) amount.value = total.toFixed(2); status.textContent = `Total proposé : ${euro(total)}. Vérifiez-le puis enregistrez vos courses.`; } catch { status.textContent = 'Lecture automatique indisponible : vous pouvez saisir le montant manuellement.'; } }
  document.addEventListener('click', event => { const action = event.target.closest('[data-nc-tracker-action]')?.dataset.ncTrackerAction; if (action) { if (action === 'previous') { shownMonth = monthShift(shownMonth, -1); mount(); } if (action === 'next') { shownMonth = monthShift(shownMonth, 1); mount(); } if (action === 'add') { const amount = number(document.getElementById('nc-tracker-amount')?.value); const date = document.getElementById('nc-tracker-date')?.value; if (!/^\d{4}-\d{2}-\d{2}$/.test(date || '') || !Number.isFinite(amount) || amount <= 0) { const status = document.getElementById('nc-tracker-photo-status'); if (status) status.textContent = 'Ajoutez une date et un montant supérieur à zéro.'; return; } const { root, data } = tracker(); data.records.push({ id:`course-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, date, amount }); writeRoot(root); shownMonth = date.slice(0, 7); mount(); } return; } const id = event.target.closest('[data-nc-tracker-delete]')?.dataset.ncTrackerDelete; if (id) { const { root, data } = tracker(); data.records = data.records.filter(record => String(record.id) !== id); writeRoot(root); mount(); } });
  document.addEventListener('change', event => { if (event.target.id === 'nc-tracker-photo') readPhoto(event.target.files?.[0]); if (event.target.id === 'nc-tracker-target') { const { root, data } = tracker(); const value = number(event.target.value); if (Number.isFinite(value) && value > 0) data.monthlyTargets[shownMonth] = value; else delete data.monthlyTargets[shownMonth]; writeRoot(root); mount(); } });
  window.addEventListener('hashchange', () => window.setTimeout(mount, 25));
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => window.setTimeout(mount, 25), { once:true }); else window.setTimeout(mount, 25);
})();
</script>

<script id="nutrichef-budget-simple-script">
/* Un suivi de dépenses mensuel sans calendrier ni lecture de ticket. */
(() => {
  'use strict';
  const rootKey = () => window.NUTRICHEF_STORAGE_KEY || 'nutrichef-v3';
  const money = value => new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR' }).format(Number(value || 0));
  const asNumber = value => Number(String(value ?? '').trim().replace(',', '.'));
  const today = () => { const date = new Date(); return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`; };
  const month = () => today().slice(0, 7);
  const monthLabel = key => new Intl.DateTimeFormat('fr-FR', { month:'long', year:'numeric' }).format(new Date(`${key}-01T12:00:00`));
  const dateLabel = key => new Intl.DateTimeFormat('fr-FR', { day:'numeric', month:'long' }).format(new Date(`${key}T12:00:00`));
  function readRoot() { try { const root = JSON.parse(localStorage.getItem(rootKey()) || '{}'); return root && typeof root === 'object' ? root : {}; } catch { return {}; } }
  function saveRoot(root) { try { localStorage.setItem(rootKey(), JSON.stringify(root)); return true; } catch { return false; } }
  function tracker() {
    const root = readRoot();
    if (!root.shoppingBudget || typeof root.shoppingBudget !== 'object') root.shoppingBudget = {};
    const data = root.shoppingBudget;
    if (!Array.isArray(data.records)) data.records = [];
    if (!data.monthlyTargets || typeof data.monthlyTargets !== 'object') data.monthlyTargets = {};
    return { root, data };
  }
  function records(data) { const key = month(); return data.records.filter(record => record?.date?.slice(0, 7) === key && Number(record.amount) > 0); }
  function total(items) { return items.reduce((sum, item) => sum + (Number(item.amount) || 0), 0); }
  function page() {
    const { data } = tracker(); const items = records(data); const spent = total(items); const target = asNumber(data.monthlyTargets[month()]); const hasTarget = Number.isFinite(target) && target > 0; const progress = hasTarget ? Math.min(100, Math.round((spent / target) * 100)) : 0; const remaining = hasTarget ? target - spent : 0;
    const history = [...items].sort((a, b) => b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id))).slice(0, 6).map(item => `<div class="budget-simple-history-row"><time datetime="${item.date}">${dateLabel(item.date)}</time><strong>${money(item.amount)}</strong><button type="button" class="budget-simple-remove" data-nc-simple-remove="${String(item.id)}" aria-label="Supprimer ${money(item.amount)}">×</button></div>`).join('');
    return `<div class="wrap budget-simple-shell"><header class="budget-simple-header"><div><h1>Le chef calcule</h1><p class="muted">Un petit geste après les courses, et Pipo suit votre budget.</p></div><img class="budget-simple-pipo" src="assets/pipo-calculatrice-button.png" alt="Pipo avec une calculatrice"></header><p class="budget-simple-month">${monthLabel(month())}</p><div class="budget-simple-grid"><section class="budget-simple-card goal"><span class="budget-simple-step">1. Je choisis</span><h2>Mon budget du mois</h2><p>Combien veux-tu prévoir pour tes courses ?</p><div class="budget-simple-goal-row"><label>Mon budget<input id="nc-simple-target" inputmode="decimal" type="number" min="0" max="9999" step="1" placeholder="Ex. 400" value="${hasTarget ? target : ''}"></label><span>€</span></div><a class="btn secondary budget-simple-list-link" href="#courses">Voir ma liste de courses</a></section><section class="budget-simple-card total"><div class="budget-simple-ring" style="--progress:${progress}%"><div><strong>${progress}%</strong><span>utilisé</span></div></div><div class="budget-simple-total-copy"><strong>${money(spent)}</strong><span>dépensés ce mois</span><span>${hasTarget ? (remaining >= 0 ? `${money(remaining)} disponibles` : `${money(Math.abs(remaining))} dépassés`) : 'Choisis un budget pour commencer'}</span></div></section></div><section class="budget-simple-card add"><span class="budget-simple-step">2. J’ajoute</span><h2>Mes courses d’aujourd’hui</h2><p>Entre simplement le total payé : Pipo l’ajoute automatiquement à ce mois.</p><div class="budget-simple-add-row"><label>J’ai dépensé<input id="nc-simple-amount" inputmode="decimal" type="number" min="0.01" max="9999.99" step="0.01" placeholder="Ex. 90,00"></label><button type="button" data-nc-simple-action="add">Ajouter au suivi</button></div><p id="nc-simple-help" class="budget-simple-help" aria-live="polite"></p></section><section class="budget-simple-card history"><span class="budget-simple-step">3. Je regarde</span><h2>Mes dernières courses</h2><p>Un aperçu rapide pour comprendre où tu en es.</p><div class="budget-simple-history-list">${history || '<p class="budget-simple-empty">Aucune dépense enregistrée ce mois-ci.</p>'}</div></section></div>`;
  }
  function mount() { if ((location.hash.slice(1) || 'accueil') !== 'budget') return; const app = document.getElementById('app'); if (!app) return; app.innerHTML = page(); document.title = 'NutriChef · Le chef calcule'; window.scrollTo(0, 0); }
  document.addEventListener('click', event => { const action = event.target.closest('[data-nc-simple-action]')?.dataset.ncSimpleAction; if (action === 'add') { const amount = asNumber(document.getElementById('nc-simple-amount')?.value); const help = document.getElementById('nc-simple-help'); if (!Number.isFinite(amount) || amount <= 0) { if (help) help.textContent = 'Indique un montant supérieur à zéro.'; return; } const { root, data } = tracker(); data.records.push({ id:`simple-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, date:today(), amount }); saveRoot(root); mount(); return; } const id = event.target.closest('[data-nc-simple-remove]')?.dataset.ncSimpleRemove; if (id) { const { root, data } = tracker(); data.records = data.records.filter(item => String(item.id) !== id); saveRoot(root); mount(); } });
  document.addEventListener('change', event => { if (event.target.id !== 'nc-simple-target') return; const { root, data } = tracker(); const value = asNumber(event.target.value); if (Number.isFinite(value) && value > 0) data.monthlyTargets[month()] = value; else delete data.monthlyTargets[month()]; saveRoot(root); mount(); });
  window.addEventListener('hashchange', () => window.setTimeout(mount, 55));
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => window.setTimeout(mount, 55), { once:true }); else window.setTimeout(mount, 55);
})();
</script>

<script id="nutrichef-hero-go-script">
/* Le bouton rond défile vers les trois choix sans changer de page. */
(() => {
  function prepareChoices() {
    if ((location.hash.slice(1) || 'accueil') !== 'accueil') return;
    const app = document.getElementById('app');
    const button = app?.querySelector('section.hero .cta');
    const choices = app?.querySelector('.home-shortcuts');
    if (!button || !choices) return;
    choices.id = 'choix-recettes';
    button.classList.add('nc-go-choices');
    button.href = '#choix-recettes';
    button.removeAttribute('data-action');
    button.dataset.ncGoChoices = 'true';
    button.setAttribute('aria-label', 'Voir les trois choix de recettes');
    button.textContent = 'GO';
  }
  document.addEventListener('click', event => {
    const button = event.target.closest('[data-nc-go-choices="true"]');
    if (!button) return;
    event.preventDefault();
    document.getElementById('choix-recettes')?.scrollIntoView({ behavior:'smooth', block:'start' });
  });
  // L'accueil est rendu après ce script lors d'une ouverture directe : on attend aussi sa création.
  let pendingFrame = 0;
  const scheduleChoices = () => {
    cancelAnimationFrame(pendingFrame);
    pendingFrame = requestAnimationFrame(prepareChoices);
  };
  const appRoot = document.getElementById('app');
  if (appRoot) new MutationObserver(scheduleChoices).observe(appRoot, { childList:true, subtree:true });
  window.addEventListener('hashchange', () => window.setTimeout(prepareChoices, 60));
  window.addEventListener('load', () => { prepareChoices(); window.setTimeout(prepareChoices, 180); }, { once:true });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => window.setTimeout(prepareChoices, 60), { once:true }); else window.setTimeout(prepareChoices, 60);
})();
</script>

<script id="nutrichef-initial-home-refresh">

(() => {

    if ((location.hash.slice(1) || 'accueil') === 'accueil') window.dispatchEvent(new Event('hashchange'));
  };
  if (document.readyState === 'complete') window.setTimeout(refreshHome, 0);
  else window.addEventListener('load', () => window.setTimeout(refreshHome, 0), { once:true });
})();
</script>
