function dates(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+week*7);return Array.from({length:7},(_,i)=>{const n=new Date(d);n.setDate(n.getDate()+i);return isoDate(n);});}
const pretty=d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const profileGate=()=>'<div class="card empty"><h2>Commençons par vous connaître.</h2><p>Votre profil permet à Pipo de respecter vos préférences et vos besoins.</p><a class="btn" href="#profil">Créer mon profil</a></div>';
const demoNotice=()=>'';
function recipeCards(rs){return rs.length?'<div class="grid">'+rs.map(r=>`<article class="card recipe"><div class="recipe-art" aria-hidden="true"><svg class="recipe-hat" viewBox="0 0 200 160" focusable="false"><path class="hat-shadow" d="M43 118h114l-8 20H51z"/><path class="hat-main" d="M52 105c-15-4-24-16-24-31 0-19 15-34 34-34 5 0 10 1 14 3 6-15 20-25 38-25 21 0 37 13 42 32 4-2 9-3 14-3 18 0 32 14 32 32 0 15-10 28-24 31v14H52z"/><path class="hat-line" d="M52 119h96"/><path class="hat-line" d="M76 39c8 8 10 18 7 30M111 27c-4 13-2 27 6 39M145 46c-6 8-8 17-6 27"/></svg></div><span class="badge">${r.tags.includes('mediterraneen')?'Cuisine méditerranéenne':'La sélection de Pipo'}</span><h3>${esc(r.title)}</h3><p class="muted">${r.kcal} kcal / 100 g · ${r.minutes||25} min</p><button class="btn recipe-cta" data-open="${esc(r.id)}">Voir la recette</button></article>`).join('')+'</div>':'<div class="card empty">Aucune recette n’est disponible pour le moment.</div>';}
function home(){const rs=catalogue.filter(r=>compatible(r,state.profile)&&r.meals.includes('midi')).sort(()=>Math.random()-.5).slice(0,3);return`<section class="hero" aria-label="Pipo vous accueille"><img class="hero-art pipo-greeting" src="nutrichef-assets-v2/image-02.jpg" data-hey-src="nutrichef-assets-v2/image-03.jpg" data-talk-src="nutrichef-assets-v2/image-04.jpg" alt="Pipo cuisine une casserole méditerranéenne" role="button" tabindex="0" data-action="greet-pipo" aria-label="Dire bonjour à Pipo"><span class="pipo-hello" aria-live="polite"></span><a class="btn cta" href="#profil" data-action="start-profile">Trouver ma recette <span aria-hidden="true">→</span></a></section><div class="wrap"><div class="intro"><div><div class="eyebrow">Une cuisine qui vous ressemble</div><p class="muted">Un peu d’inspiration, de bons ingrédients et Pipo à vos côtés.</p></div><a class="btn secondary week-cta" href="${state.profile?'#calendrier':'#profil'}">${state.profile?'<span class="mini-moustache" aria-hidden="true"></span>Organiser ma semaine<span class="mini-moustache" aria-hidden="true"></span>':'1. Je complète mon profil'}</a></div><div class="grid home-shortcuts"><a class="card green" href="#cuisine"><h3>Recette personnalisée</h3><img class="shortcut-illustration shortcut-thinking" src="nutrichef-assets-v2/image-01.png" alt="Pipo réfléchit à votre recette"></a><a class="card gold" href="#panier"><h3>Panier bleu</h3><img class="shortcut-illustration shortcut-basket" src="nutrichef-assets-v2/image-05.png" alt="Panier bleu avec des ingrédients méditerranéens"></a><a class="card blue" href="#chef"><h3>Recette du chef</h3><img class="shortcut-illustration shortcut-moustache" src="nutrichef-assets-v2/image-06.png" alt="La moustache de Pipo"></a></div></div>`;}
function field(name,title,type='text',extra=''){return`<label>${title}<input name="${name}" type="${type}" value="${esc(draft[name]??'')}" ${extra} required></label>`;}
function select(name,title,options){return`<label>${title}<select name="${name}" required><option value="">Choisir</option>${options.map(([value,label])=>`<option value="${value}" ${String(draft[name])===String(value)?'selected':''}>${label}</option>`).join('')}</select></label>`;}
function wizard(){return`<div class="eyebrow">Faisons connaissance</div><h1>Votre profil, votre cuisine.</h1><p class="muted">Quelques informations pour cuisiner à votre rythme.</p><div class="steps">${['À propos de vous','Votre rythme','Vos préférences'].map((s,i)=>`<span class="${step===i?'active':''}">${i+1}. ${s}</span>`).join('')}</div><form id="profile-form" class="card">${step===0?`<div class="fields">${field('firstName','Prénom','text','maxlength="50" autocomplete="given-name"')}${field('age','Âge','number','min="18" max="100" step="1"')}${select('sex','Sexe utilisé pour le calcul',[['homme','Homme'],['femme','Femme']])}${field('weight','Poids (kg)','number','min="30" max="350" step="0.1"')}${field('height','Taille (cm)','number','min="120" max="230" step="0.1"')}</div><p class="muted">Les repères chiffrés sont affichés pour les adultes de 19 à 78 ans ; ils restent indicatifs.</p>`:step===1?`${select('activity','Niveau d’activité physique',[[1.2,'Sédentaire'],[1.375,'Légèrement actif'],[1.55,'Modérément actif'],[1.725,'Très actif']])}${select('goal','Objectif nutritionnel',[['perdre','Perdre du poids'],['maintenir','Maintenir mon poids'],['prendre','Prendre du poids']])}<label><input name="special" type="checkbox" ${draft.special?'checked':''}>Grossesse, allaitement, maladie, traitement, trouble alimentaire ou besoin nutritionnel particulier</label><p class="muted">Dans ce cas, Pipo conserve vos préférences sans fixer automatiquement un objectif calorique.</p>`:`${select('diet','Préférences alimentaires',['Omnivore','Végétarien','Végétalien','Pescatarien'].map(x=>[x,x]))}<h3>Allergies et exclusions</h3><div class="checks">${exclusions.map(x=>`<label><input type="checkbox" name="exclusions" value="${x}" ${(draft.exclusions||[]).includes(x)?'checked':''}>${x}</label>`).join('')}</div><div class="notice">Vérifiez toujours les étiquettes et les risques de traces. Un filtre de recettes ne peut pas garantir l’absence de contamination croisée.</div><label><input type="checkbox" required>J’accepte d’enregistrer mon profil sur cet appareil. Je peux l’effacer à tout moment.</label>`}<div class="actions"><button type="button" class="secondary" data-action="profile-back">${step?'Précédent':'Annuler'}</button><button type="submit">${step===2?'Enregistrer mon profil':'Continuer →'}</button></div></form>`;}
function chart(){const points=[...state.weights].sort((a,b)=>a.date.localeCompare(b.date)).slice(-16);if(!points.length)return'<p>Aucune pesée enregistrée.</p>';const lo=Math.min(...points.map(p=>p.weight))-1,hi=Math.max(...points.map(p=>p.weight))+1;const xy=points.map((p,i)=>[45+i*450/Math.max(1,points.length-1),160-(p.weight-lo)/(hi-lo)*125]);return`<svg class="chart" viewBox="0 0 530 205" role="img" aria-label="Évolution du poids ; valeurs détaillées dans le tableau"><path d="M45 20V165H510" fill="none" stroke="#d7ddcc"/><text x="0" y="38">${fmt(hi)} kg</text><text x="0" y="163">${fmt(lo)} kg</text><polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#5f8347" stroke-width="3"/>${xy.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="5" fill="#5f8347"><title>${points[i].date} : ${points[i].weight} kg</title></circle>`).join('')}<text x="45" y="195">${pretty(points[0].date)}</text><text x="440" y="195">${pretty(points.at(-1).date)}</text></svg>`;}
function profile(){if(!state.profile||editing)return wizard();const p=state.profile,n=nutrition(p),goalLabel=p.goal==='perdre'?'votre objectif déclaré de perte de poids':p.goal==='prendre'?'votre objectif déclaré de prise de poids':'le maintien de votre poids',exclusionsLabel=p.exclusions.length?'Sans : '+p.exclusions.map(esc).join(', '):'Aucune exclusion déclarée';return`<div class="intro"><div><div class="eyebrow">Votre espace personnel</div><h1>Bonjour ${esc(p.firstName)}.</h1><p class="muted">Des repères simples pour organiser votre cuisine.</p></div><button class="secondary" data-action="edit-profile">Modifier mon profil</button></div><div class="two nc-profile-dashboard"><section class="card green nc-balance-card"><div class="nc-balance-head"><h2>Mon équilibre</h2><span class="nc-bmi-chip">IMC indicatif</span></div><div class="gauge" role="img" aria-label="IMC ${fmt(n.bmi)} : ${n.category}"><i style="left:${Math.max(0,Math.min(100,(n.bmi-15)/25*100))}%"></i></div><div class="nc-balance-body"><img class="nc-pipo-guide" src="nutrichef-assets-v2/image-01.png" alt="Pipo, le chef NutriChef"><div><div class="nc-bmi-number">${fmt(n.bmi)} <span>IMC</span></div><p class="nc-bmi-category">${n.category}</p></div></div><p class="nc-bmi-reference">Repères adultes : &lt; 18,5 · 18,5–24,9 · 25–29,9 · ≥ 30. L’IMC est un indicateur de dépistage, pas un diagnostic.</p></section><section class="card nc-energy-card"><div class="eyebrow">Votre repère quotidien</div><div class="metric">${n.target?'≈ '+fmt(n.target):'À définir'} <small>${n.target?'kcal / jour':''}</small></div><p class="nc-energy-lead">${n.target?'Estimation de départ pour '+goalLabel+'. Elle aide à choisir des recettes ; elle ne remplace pas un avis médical ou diététique.':esc(n.restriction||'Un professionnel peut vous aider à définir un repère adapté à votre situation.')}</p>${n.eligible?`<div class="nc-energy-breakdown" aria-label="Détail du calcul"><div><strong>${fmt(n.bmr)} kcal</strong><span>Métabolisme de base estimé<br>au repos</span></div><div><strong>${fmt(n.tdee)} kcal</strong><span>Dépense journalière estimée<br>avec votre activité</span></div></div>`:`<div class="nc-no-target">Aucun objectif calorique automatique n’est proposé pour ce profil. Vos préférences alimentaires restent utilisées pour sélectionner les recettes.</div>`}<div class="nc-profile-tags"><span>${esc(p.diet)}</span><span>${exclusionsLabel}</span></div><a class="btn" href="#cuisine">Trouver ma recette →</a></section></div><section class="card section-gap"><div class="intro"><div><h2>Mon poids au fil des semaines</h2><p class="muted">Une pesée par semaine suffit pour suivre votre tendance.</p></div></div>${chart()}<form id="weight-form" class="toolbar"><label>Date<input type="date" name="date" max="${isoDate()}" value="${isoDate()}" required></label><label>Poids (kg)<input name="weight" type="number" min="30" max="350" step="0.1" required value="${p.weight}"></label><button>Enregistrer ma pesée</button></form><details><summary>Historique des pesées</summary><table><thead><tr><th>Date</th><th>Poids</th></tr></thead><tbody>${[...state.weights].sort((a,b)=>b.date.localeCompare(a.date)).map(w=>`<tr><td>${pretty(w.date)}</td><td>${fmt(w.weight)} kg</td></tr>`).join('')}</tbody></table></details></section><details class="notice nc-profile-method"><summary>Comment sont calculés mes repères ?</summary><p>Pour les adultes de 19 à 78 ans sans situation particulière déclarée, NutriChef estime le métabolisme de base avec l’équation de Mifflin–St Jeor, puis applique le niveau d’activité renseigné. Le repère affiché est une estimation de départ : ce n’est ni un diagnostic, ni une prescription, ni un suivi diététique.</p><p>Pour les mineurs, pendant la grossesse ou l’allaitement, en cas de maladie, de traitement, de trouble alimentaire ou d’IMC inférieur à 18,5 ou supérieur ou égal à 30, aucun objectif automatique n’est affiché.</p><a href="https://pubmed.ncbi.nlm.nih.gov/2305711/" target="_blank" rel="noopener">Équation de Mifflin–St Jeor</a> · <a href="https://www.ameli.fr/assure/sante/themes/surpoids-obesite-adulte/calcul-imc-bilan-medical" target="_blank" rel="noopener">Repères IMC adultes</a></details>`;}
function cuisine(){const choices=[['personnalisees','choice-green','01','Recette personnalisée','Des idées adaptées à votre profil et à votre repère calorique.','nutrichef-assets-v2/image-01.png','Pipo réfléchit à votre recette'],['panier','choice-blue','02','Panier bleu','Exclusivement les recettes méditerranéennes du catalogue.','nutrichef-assets-v2/image-05.png','Panier bleu avec des ingrédients méditerranéens'],['chef','choice-gold','03','Recette du chef','Laissez Pipo vous surprendre avec une recette au hasard.','nutrichef-assets-v2/image-06.png','La moustache de Pipo']];return`<div class="cuisine-heading"><div><div class="eyebrow">À vous de choisir</div><h1>Qu’est-ce qu’on cuisine ?</h1><p class="muted">Trois chemins, toujours le plaisir de passer à table.</p></div><button class="secondary refresh-catalogue" type="button" data-action="refresh-catalogue" aria-label="Actualiser les recettes FoodCloud">↻ Actualiser les recettes</button></div><div class="grid cuisine-choices">${choices.map(([id,color,num,title,description,art,alt])=>`<a href="#${id}" class="card choice-card ${color}"><span class="choice-number">${num}</span><span class="choice-art"><img class="choice-illustration" src="${art}" alt="${alt}"></span><span class="choice-copy"><h3>${title}</h3><p>${description}</p></span><span class="choice-arrow" aria-hidden="true">→</span></a>`).join('')}</div>${demoNotice()}`;}
function listing(route){if(!state.profile)return profileGate();const n=nutrition(state.profile);let pool=catalogue.filter(r=>compatible(r,state.profile));if(route==='panier')pool=pool.filter(r=>isForFoodCloudRoute(r,'panier')&&(r.routes&&r.routes.length||r.tags.includes('mediterraneen')));if(route==='personnalisees')pool=pool.filter(r=>isForFoodCloudRoute(r,'personnalisees')&&r.meals.includes(selectedMeal)&&(!n.target||Math.abs(r.kcal-n.target*fractions[selectedMeal])<=n.target*fractions[selectedMeal]*.25));if(route==='chef')pool=pool.filter(r=>isForFoodCloudRoute(r,'chef'));if(filter)pool=pool.filter(r=>(r.title+' '+r.ingredients.map(i=>i.name).join(' ')).toLocaleLowerCase('fr').includes(filter.toLocaleLowerCase('fr')));if(route==='chef'&&pool.length)pool=[pool[Math.floor(Math.random()*pool.length)]];return`<a href="#cuisine">← Les trois façons de cuisiner</a><h1>${route==='panier'?'Le panier bleu':route==='chef'?'La surprise du chef':'Vos recettes personnalisées'}</h1><p class="muted">${route==='panier'?'Les recettes que vous avez choisies pour votre panier bleu.':route==='chef'?'Une découverte aléatoire parmi les recettes du chef compatibles avec le profil.':'Des recettes compatibles avec le profil, le repas choisi et le repère calorique.'}</p>${demoNotice()}${route==='personnalisees'&&!n.target?'<div class="notice">Filtrage par préférences uniquement : aucun objectif calorique défini pour votre profil.</div>':''}<form id="search-form" class="toolbar"><input aria-label="Rechercher une recette" name="query" placeholder="Une recette, un ingrédient…" value="${esc(filter)}">${route==='personnalisees'?`<select name="meal" aria-label="Repas" style="width:auto">${Object.entries(mealNames).map(([k,v])=>`<option value="${k}" ${selectedMeal===k?'selected':''}>${v}</option>`).join('')}</select>`:''}<button>Rechercher</button>${route==='chef'?'<button type="button" class="secondary" data-action="refresh">Une autre idée</button>':''}</form>${recipeCards(pool)}`;}
function calendar(){if(!state.profile)return profileGate();const ds=dates(),pool=catalogue.filter(r=>compatible(r,state.profile)),n=nutrition(state.profile),activeDate=ds.includes(calendarDay)?calendarDay:ds[0],entries=state.menus[activeDate]||{},total=Object.values(entries).reduce((s,m)=>s+(catalogue.find(r=>r.id===m.id)?.kcal||0)*m.portions,0),activeLabel=pretty(activeDate),today=isoDate();return`<section class="calendar-intro"><div><div class="eyebrow">Moins d’improvisation, plus de plaisir</div><h1>Mon calendrier</h1><p class="muted">Choisissez une journée, puis composez simplement ses repas.</p></div><div class="calendar-navigation"><button class="calendar-nav-button" aria-label="Semaine précédente" data-action="prev-week">←</button><strong>${pretty(ds[0])} — ${pretty(ds[6])}</strong><button class="calendar-nav-button" aria-label="Semaine suivante" data-action="next-week">→</button></div></section><div class="calendar-action-row"><button data-action="auto-menu">Créer ma semaine avec Pipo</button><button class="secondary" data-action="week-shopping">Ajouter aux courses</button></div><p class="calendar-tip">${n.target?'Votre repère est de '+fmt(n.target)+' kcal par jour.':'Vos choix restent adaptés à votre profil.'} <strong>Appuyez sur une date pour ouvrir son menu.</strong></p><section class="playful-calendar" aria-label="Calendrier de la semaine">${ds.map(date=>{const mealCount=Object.keys(state.menus[date]||{}).length,dayName=new Date(date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short'}),dayNumber=Number(date.slice(-2));return`<button type="button" class="calendar-date-button ${date===activeDate?'is-selected':''} ${date===today?'is-today':''} ${mealCount?'has-menu':''}" data-action="open-calendar-day" data-calendar-date="${date}" aria-pressed="${date===activeDate}"><span class="calendar-orb"><small>${dayName.replace('.','')}</small><strong>${dayNumber}</strong></span><span class="calendar-date-label">${pretty(date)}</span><span class="calendar-date-status">${mealCount?mealCount+' repas':'À composer'}</span></button>`;}).join('')}</section><section class="calendar-editor" aria-live="polite"><div class="calendar-editor-head"><div><span class="calendar-editor-kicker">Menu du jour</span><h2>${activeLabel}</h2><p>${Object.keys(entries).length?'Votre menu prend forme, modifiez un repas si besoin.':'Choisissez ce que vous avez envie de manger.'}</p></div><div class="calendar-total"><strong>${Math.round(total)}</strong><span>kcal prévues</span></div></div><div class="calendar-meals">${Object.entries(mealNames).map(([slot,label])=>{const m=entries[slot],r=m&&catalogue.find(r=>r.id===m.id),choices=pool.filter(recipe=>recipe.meals.includes(slot));return`<article class="calendar-meal ${r?'is-filled':''}"><div class="calendar-meal-heading"><span>${label}</span>${r?`<a href="#" data-open="${esc(r.id)}">${esc(r.title)}</a>`:'<small>Aucun repas choisi</small>'}</div><label class="calendar-select"><span>${r?'Changer le repas':'Choisir un repas'}</span><select aria-label="Choisir ${label} le ${activeLabel}" data-meal="${activeDate}|${slot}"><option value="">${r?'Remplacer…':'Choisir…'}</option>${choices.map(recipe=>`<option value="${esc(recipe.id)}">${esc(recipe.title)}</option>`).join('')}</select></label>${r?`<div class="calendar-meal-bottom"><label>Portions<input type="number" min="0.25" max="10" step="0.01" data-portions="${activeDate}|${slot}" value="${m.portions}"></label><small>${Math.round(r.kcal*m.portions)} kcal${!compatible(r,state.profile)?' · À vérifier avec votre profil':''}</small><button type="button" class="calendar-remove" data-remove-meal="${activeDate}|${slot}">Retirer</button></div>`:''}</article>`;}).join('')}</div></section>${demoNotice()}`;}function courses(){const remaining=state.shopping.filter(i=>!i.done),done=state.shopping.filter(i=>i.done),item=i=>`<li class="shopping-item ${i.done?'is-done':''}"><label class="shopping-check"><input type="checkbox" data-check="${i.id}" ${i.done?'checked':''}><span c     return `<div class="wrap budget-shell"><section class="budget-heading"><div><div class="eyebrow">Le ticket de caisse, sans calcul mental</div><h1>Le chef calcule</h1><p class="muted">Prenez votre ticket en photo, vérifiez le total, puis gardez-le ici avec votre liste.</p></div><img class="budget-pipo" src="nutrichef-assets-v2/image-01.png" alt="Pipo avec sa calculatrice"></section><section class="budget-total-card"><div><p>${applied ? 'Dernier total enregistré' : 'Total des prix renseignés'}</p><strong id="nc-budget-total">${money(savedTotal())}</strong><p id="nc-budget-total-help">${applied ? 'Le total du ticket est conservé sur cet appareil.' : 'Ajoutez les prix ci-dessous, ou laissez Pipo lire le ticket.'}</p></div><span aria-hidden="true" style="font-size:44px">🧮</span></section><section class="budget-photo-card"><h2>Photographier le ticket</h2><p class="budget-help">Depuis un téléphone, le bouton ouvre directement l’appareil photo. La lecture se fait dans le navigateur et le total proposé doit toujours être vérifié.</p><div class="budget-photo-actions"><label class="btn budget-photo-button">📷 Prendre ou ajouter une photo<input id="nc-receipt-photo" type="file" accept="image/*" capture="environment"></label><button type="button" class="secondary" data-nc-action="clear-ticket-total" ${applied ? '' : 'disabled'}>Effacer le total</button></div><img id="nc-receipt-preview" class="budget-photo-preview" alt="Aperçu du ticket de caisse"><p id="nc-ocr-status" class="budget-ocr-status" aria-live="polite">Aucune photo analysée pour le moment.</p><div id="nc-ocr-result"></div><div class="budget-ticket-total"><label>Montant total du ticket<input id="nc-ticket-total" inputmode="decimal" type="number" min="0" max="9999.99" step="0.01" placeholder="Ex. 42,70" value="${applied ? Number(b.ticketTotal).toFixed(2) : ''}"></label><button type="button" data-nc-action="save-ticket-total">Enregistrer ce total</button></div></section><section class="budget-lines-card"><h2>Prix article par article</h2><p class="budget-help">Vous pouvez corriger ou compléter chaque prix : le total se met à jour et reste enregistré sur cet appareil.</p><div class="budget-price-list">${lines || '<p class="budget-empty">Ajoutez d’abord des produits à votre liste de courses.</p>'}</div></section><a class="btn secondary budget-back" href="#courses">← Revenir à ma liste de courses</a></div>`;
  }

  function replaceHomeIntro() {
    const intro = document.querySelector('#app .wrap > .intro');
    if (!intro || intro.dataset.ncReplaced) return;
    const oldLink = intro.querySelector('.week-cta');
    const href = oldLink?.getAttribute('href') || '#calendrier';
    intro.dataset.ncReplaced = 'true';
    intro.outerHTML = `<div class="home-week-row"><a class="btn week-cta week-cta-full" href="${href}"><span class="week-calendar" aria-hidden="true">🗓️</span><span>Organiser ma semaine</span><img class="week-pipo" src="nutrichef-assets-v2/image-01.png" alt=""></a></div>`;
  }

  function addBudgetCallout() {
    const exportBox = document.querySelector('#app .shopping-export');
    if (!exportBox || document.querySelector('.shopping-budget-callout')) return;
    const callout = document.createElement('section');
    callout.className = 'shopping-budget-callout';
    callout.innerHTML = `<div><h2>Le chef calcule</h2><p>Photographiez votre ticket, gardez le total de vos courses et vérifiez les prix avec Pipo.</p></div><a class="shopping-budget-button" href="#budget"><img src="nutrichef-assets-v2/image-01.png" alt="">🧮 Le chef calcule</a>`;
    exportBox.insertAdjacentElement('afterend', callout);
  }

  function mount() {
    const route = location.hash.slice(1) || 'accueil';
    const app = document.querySelector('#app');
    if (!app) return;
    if (route === 'budget') {
      app.innerHTML = budgetPage();
      document.title = 'NutriChef · Le chef calcule';
      return;
    }
    if (route === 'accueil') replaceHomeIntro();
    if (route === 'courses') addBudgetCallout();
  }

  function extractTotal(text) {
    const amount = line => [...line.matchAll(/(?:^|[^0-9])(\d{1,4}(?:[ .]\d{3})*[,.]\d{2})(?:\s*(?:€|eur))?/gi)].map(match => Number(match[1].replace(/[ .]/g, '').replace(',', '.'))).filter(value => Number.isFinite(value) && value >= 0 && value < 10000);
    const lines = String(text || '').split(/\r?\n/);
    const marked = lines.filter(line => /total|a\s*payer|montant|somme/i.test(line)).flatMap(amount);
    const all = lines.flatMap(amount);
    return marked.at(-1) ?? all.at(-1) ?? null;
  }

  function loadOcr() {
    if (window.Tesseract) return Promise.resolve(window.Tesseract);
    if (ocrLoader) return ocrLoader;
    ocrLoader = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      script.async = true;
      script.onload = () => window.Tesseract ? resolve(window.Tesseract) : reject(new Error('Bibliothèque indisponible'));
      script.onerror = () => reject(new Error('Chargement impossible'));
      document.head.appendChild(script);
    });
    return ocrLoader;
  }

  async function readPhoto(file) {
    const status = document.querySelector('#nc-ocr-status');
    const result = document.querySelector('#nc-ocr-result');
    const preview = document.querySelector('#nc-receipt-preview');
    if (!file || !status || !result || !preview) return;
    if (photoUrl) URL.revokeObjectURL(photoUrl);
    photoUrl = URL.createObjectURL(file);
    preview.src = photoUrl;
    preview.style.display = 'block';
    status.textContent = 'Pipo lit les montants du ticket…';
    result.innerHTML = '';
    try {
      const Tesseract = await loadOcr();
      const { data } = await Tesseract.recognize(file, 'fra+eng', { logger: message => {
        if (message.status === 'recognizing text' && Number.isFinite(message.progress)) status.textContent = `Pipo lit le ticket… ${Math.round(message.progress * 100)} %`;
      }});
      const total = extractTotal(data.text);
      if (total === null) {
        status.textContent = 'Pipo n’a pas trouvé de total lisible.';
        result.innerHTML = '<div class="budget-ocr-result">Vous pouvez tout de même inscrire le montant final manuellement ci-dessous.</div>';
        return;
      }
      document.querySelector('#nc-ticket-total').value = total.toFixed(2);
      status.textContent = 'Un total a été proposé : vérifiez-le avant de l’enregistrer.';
      result.innerHTML = `<div class="budget-ocr-result"><strong>Total détecté : ${money(total)}</strong><br>Le montant a été placé dans le champ ci-dessous. Il n’est conservé qu’après votre confirmation.</div>`;
    } catch {
      status.textContent = 'La lecture automatique est indisponible pour cette photo.';
      result.innerHTML = '<div class="budget-ocr-result">Pas de souci : saisissez le montant final manuellement, puis enregistrez-le.</div>';
    }
  }

  document.addEventListener('click', event => {
    const action = event.target.closest('[data-nc-action]')?.dataset.ncAction;
    if (!action) return;
    if (action === 'save-ticket-total') {
      const field = document.querySelector('#nc-ticket-total');
      const value = Number(field?.value);
      if (!Number.isFinite(value) || value <= 0) { toast('Ajoutez un montant supérieur à zéro.'); return; }
      budget().ticketTotal = value;
      budget().ticketDate = new Date().toISOString();
      saveBudget();
      mount();
      toast('Le total de vos courses est enregistré.');
    }
    if (action === 'clear-ticket-total') {
      budget().ticketTotal = null;
      budget().ticketDate = null;
      saveBudget();
      mount();
      toast('Le total enregistré a été effacé.');
    }
  });

  document.addEventListener('input', event => {
    const input = event.target;
    if (!input.matches('[data-nc-price-id]')) return;
    const value = Number(input.value);
    budget().prices[input.dataset.ncPriceId] = Number.isFinite(value) && value >= 0 ? value : 0;
    budget().ticketTotal = null;
    saveBudget();
    const total = document.querySelector('#nc-budget-total');
    const help = document.querySelector('#nc-budget-total-help');
    if (total) total.textContent = money(itemTotal());
    if (help) help.textContent = 'Total des prix renseignés, enregistré sur cet appareil.';
  });

  document.addEventListener('change', event => {
    if (event.target.id === 'nc-receipt-photo') readPhoto(event.target.files?.[0]);
  });

  window.addEventListener('hashchange', () => setTimeout(mount, 0));
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(mount, 0), { once: true });
  else setTimeout(mount, 0);
})();
</script>

  const storageKey = () => window.NUTRICHEF_STORAGE_KEY || 'nutrichef-v3';

  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[char]);
  const toNumber = value => Number(String(value ?? '').trim().replace(',', '.'));
  const idFor = item => String(item?.id ?? item?.name ?? 'article');
  function readData() {
    try { const parsed = JSON.parse(localStorage.getItem(storageKey()) || '{}'); return parsed && typeof parsed === 'object' ? parsed : {}; }
    catch { return {}; }
  }

    try { localStorage.setItem(storageKey(), JSON.stringify(data)); return true; }
    catch { return false; }
  }

nes-card"><h2>Prix article par article</h2><p class="budget-help">Vous pouvez corriger ou compléter chaque prix : le total se met à jour et reste enregistré sur cet appareil.</p><div class="budget-price-list">${lines || '<p class="budget-empty">Ajoutez d’abord des produits à votre liste de courses.</p>'}</div></section><a class="btn secondary budget-back" href="#courses">← Revenir à ma liste de courses</a></div>`;

    if (!file || !status || !result || !preview) return;

      const Tesseract = await loadOcr(); const { data } = await Tesseract.recognize(file, 'fra+eng', { logger: message => { if (message.status === 'recognizing text' && Number.isFinite(message.progress)) status.textContent = `Pipo lit le ticket… ${Math.round(message.progress * 100)} %`; } });
      const total = findTotal(data.text);
      if (total === null) { status.textContent = 'Pipo n’a pas trouvé de total lisible.'; result.innerHTML = '<div class="budget-ocr-result">Vous pouvez inscrire le montant final manuellement ci-dessous.</div>'; return; }
      const field = document.getElementById('nc-fixed-ticket-total'); if (field) field.value = total.toFixed(2);
      status.textContent = 'Un total a été proposé : vérifiez-le avant de l’enregistrer.'; result.innerHTML = `<div class="budget-ocr-result"><strong>Total détecté : ${formatMoney(total)}</strong><br>Le montant a été placé dans le champ ci-dessous. Il n’est conservé qu’après votre confirmation.</div>`;
    } catch { status.textContent = 'La lecture automatique est indisponible pour cette photo.'; result.innerHTML = '<div class="budget-ocr-result">Saisissez le montant final manuellement, puis enregistrez-le.</div>'; }
  }
  document.addEventListener('click', event => {
    const action = event.target.closest('[data-nc-budget-action]')?.dataset.ncBudgetAction; if (!action) return;
    const data = dataWithBudget();
    if (action === 'save') { const value = toNumber(document.getElementById('nc-fixed-ticket-total')?.value); if (!Number.isFinite(value) || value <= 0) { flash('Ajoutez un montant supérieur à zéro.'); return; } data.shoppingBudget.ticketTotal = value; data.shoppingBudget.ticketDate = new Date().toISOString(); writeData(data); mountFixedRoute(); flash('Le total de vos courses est enregistré.'); }
    if (action === 'clear') { data.shoppingBudget.ticketTotal = null; data.shoppingBudget.ticketDate = null; writeData(data); mountFixedRoute(); flash('Le total enregistré a été effacé.'); }
  });
  document.addEventListener('input', event => {
    const input = event.target; if (!input.matches('[data-nc-fixed-price]')) return;
    const data = dataWithBudget(); const value = toNumber(input.value); data.shoppingBudget.prices[input.dataset.ncFixedPrice] = Number.isFinite(value) && value >= 0 ? value : 0; data.shoppingBudget.ticketTotal = null; data.shoppingBudget.ticketDate = null; writeData(data);
    const total = document.getElementById('nc-fixed-budget-total'); const help = document.getElementById('nc-fixed-budget-help'); if (total) total.textContent = formatMoney(linesTotal(data)); if (help) help.textContent = 'Total des prix renseignés, enregistré sur cet appareil.';
  });
  document.addEventListener('change', event => { if (event.target.id === 'nc-fixed-receipt-photo') readReceipt(event.target.files?.[0]); });
  window.addEventListener('hashchange', () => window.setTimeout(mountFixedRoute, 0));
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => window.setTimeout(mountFixedRoute, 0), { once:true }); else window.setTimeout(mountFixedRoute, 0);
})();
</script>

<script id="nutrichef-budget-calendar-script">
/* Suivi mensuel des courses : données conservées uniquement dans le navigateur de l'utilisateur. */
(() => {
  'use strict';
  let shownMonth = monthKey(new Date());
  let ocrLoader;
  const storeKey = () => window.NUTRICHEF_STORAGE_KEY || 'nutrichef-v3';
  const euro = value => new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR' }).format(Number(value || 0));
  const number = value => Number(String(value ?? '').trim().replace(',', '.'));
  function dayKey(date = new Date()) { return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`; }
  function monthKey(date) { return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`; }
  function parseDay(key) { return new Date(`${key}T12:00:00`); }
  function monthName(key) { return new Intl.DateTimeFormat('fr-FR', { month:'long', year:'numeric' }).format(new Date(`${key}-01T12:00:00`)); }
  function dayName(key) { return new Intl.DateTimeFormat('fr-FR', { weekday:'long', day:'numeric', month:'long' }).format(parseDay(key)); }
  function readRoot() { try { const value = JSON.parse(localStorage.getItem(storeKey()) || '{}'); return value && typeof value === 'object' ? value : {}; } catch { return {}; } }
  function writeRoot(root) { try { localStorage.setItem(storeKey(), JSON.stringify(root)); return true; } catch { return false; } }
  function tracker() {
    const root = readRoot();
    if (!root.shoppingBudget || typeof root.shoppingBudget !== 'object') root.shoppingBudget = {};
    const data = root.shoppingBudget;
    if (!Array.isArray(data.records)) data.records = [];
    if (!data.monthlyTargets || typeof data.monthlyTargets !== 'object') data.monthlyTargets = {};
    const oldTotal = number(data.ticketTotal);
    if (!data.calendarMigrated && Number.isFinite(oldTotal) && oldTotal > 0) { data.records.push({ id:`ancien-${Date.now()}`, date:(data.ticketDate || new Date().toISOString()).slice(0, 10), amount:oldTotal }); data.calendarMigrated = true; }
    return { root, data };
  }
  function recordsFor(data, key) { return data.records.filter(record => /^\d{4}-\d{2}-\d{2}$/.test(record.date || '') && record.date.slice(0, 7) === key && Number(record.amount) > 0); }
  function sum(records) { return records.reduce((total, record) => total + (Number(record.amount) || 0), 0); }
  function weekStart(date) { const copy = new Date(date); copy.setHours(12, 0, 0, 0); copy.setDate(copy.getDate() - ((copy.getDay() + 6) % 7)); return dayKey(copy); }
  function currentWeekTotal(data) { const start = weekStart(new Date()); const end = new Date(`${start}T12:00:00`); end.setDate(end.getDate() + 7); return sum(data.records.filter(record => { const date = parseDay(record.date); return date >= parseDay(start) && date < end; })); }
  function monthShift(key, offset) { const date = new Date(`${key}-01T12:00:00`); date.setMonth(date.getMonth() + offset); return monthKey(date); }
  function dayAmount(records, key) { return sum(records.filter(record => record.date === key)); }
  function calendarCells(key, records) {
    const [year, month] = key.split('-').map(Number); const first = new Date(year, month - 1, 1); const days = new Date(year, month, 0).getDate(); const leading = (first.getDay() + 6) % 7; const total = Math.ceil((leading + days) / 7) * 7; const today = dayKey(); let html = '';
    for (let index = 0; index < total; index += 1) { const day = index - leading + 1; if (day < 1 || day > days) { html += '<div class="budget-day empty" aria-hidden="true"></div>'; continue; } const date = `${key}-${String(day).padStart(2, '0')}`; const amount = dayAmount(records, date); html += `<div class="budget-day ${date === today ? 'today' : ''}" title="${dayName(date)}"><time datetime="${date}">${day}</time>${amount ? `<span class="budget-day-amount">${euro(amount)}</span>` : ''}</div>`; }
    return html;
  }
  function page() {
    const { data } = tracker(); const records = recordsFor(data, shownMonth); const spent = sum(records); const target = number(data.monthlyTargets[shownMonth]); const hasTarget = Number.isFinite(target) && target > 0; const progress = hasTarget ? Math.min(100, Math.round((spent / target) * 100)) : 0; const remaining = hasTarget ? target - spent : 0; const thisWeek = currentWeekTotal(data);
    const history = [...records].sort((a, b) => b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id))).map(record => `<div class="budget-history-row"><time datetime="${record.date}">${dayName(record.date)}</time><strong>${euro(record.amount)}</strong><button class="budget-delete" type="button" data-nc-tracker-delete="${String(record.id).replace(/&/g, '&amp;').replace(/"/g, '&quot;')}" aria-label="Supprimer la dépense du ${dayName(record.date)}">×</button></div>`).join('');
    return `<div class="wrap budget-calendar-shell"><header class="budget-calendar-header"><div><h1>Le chef calcule</h1><p class="muted">Suivez vos courses mois après mois, sans perdre le fil.</p></div><img class="budget-calendar-pipo" src="assets/pipo-calculatrice-button.png" alt="Pipo tenant une calculatrice"></header><div class="budget-month-switcher"><button type="button" class="secondary" data-nc-tracker-action="previous" aria-label="Mois précédent">‹</button><h2>${monthName(shownMonth)}</h2><button type="button" class="secondary" data-nc-tracker-action="next" aria-label="Mois suivant">›</button></div><section class="budget-overview"><div class="budget-target-card"><h3>Mon budget courses</h3><p>Choisissez votre objectif pour le mois. Il reste modifiable à tout moment.</p><div class="budget-target-input"><label>Budget de ${monthName(shownMonth)}<input id="nc-tracker-target" inputmode="decimal" type="number" min="0" max="9999" step="1" placeholder="Ex. 400" value="${hasTarget ? target : ''}"></label><span>€ / mois</span></div><a class="btn secondary budget-list-link" href="#courses">Voir ma liste de courses</a></div><div class="budget-ring-card"><div class="budget-ring" style="--progress:${progress}%"><div><strong>${progress}%</strong><span>du budget</span></div></div><div class="budget-ring-copy"><strong>${euro(spent)}</strong><span>dépensés ce mois</span><span>${hasTarget ? (remaining >= 0 ? `${euro(remaining)} restants` : `${euro(Math.abs(remaining))} au-dessus`) : 'Ajoutez un budget mensuel'}</span><span>Cette semaine : ${euro(thisWeek)}</span></div></div></section><section class="budget-add-card"><div class="budget-add-top"><div><h2>Ajouter mes courses</h2><p>Ajoutez le total d’un ticket à la date de vos courses. La photo peut préremplir le montant, que vous vérifiez ensuite.</p></div><label class="btn budget-photo-mini">Prendre une photo<input id="nc-tracker-photo" type="file" accept="image/*" capture="environment"></label></div><p id="nc-tracker-photo-status" class="budget-photo-status" aria-live="polite"></p><div class="budget-add-grid"><label>Date des courses<input id="nc-tracker-date" type="date" value="${dayKey()}" max="2100-12-31"></label><label>Total du ticket<input id="nc-tracker-amount" inputmode="decimal" type="number" min="0.01" max="9999.99" step="0.01" placeholder="Ex. 90,00"></label><button type="button" data-nc-tracker-action="add">Enregistrer mes courses</button></div></section><section class="budget-calendar-card"><div class="budget-calendar-weekdays"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div><div class="budget-calendar-grid">${calendarCells(shownMonth, records)}</div></section><section class="budget-history-card"><h2>Mes courses du mois</h2><p>Chaque total est enregistré à sa date pour garder une vue claire de vos dépenses.</p><div class="budget-history-list">${history || '<p class="budget-empty-history">Aucune course enregistrée pour ce mois.</p>'}</div></section></div>`;
  }
  function mount() { if ((location.hash.slice(1) || 'accueil') !== 'budget') return; const app = document.getElementById('app'); if (!app) return; app.innerHTML = page(); document.title = 'NutriChef · Le chef calcule'; window.scrollTo(0, 0); }
  function getOcr() { if (window.Tesseract) return Promise.resolve(window.Tesseract); if (ocrLoader) return ocrLoader; ocrLoader = new Promise((resolve, reject) => { const script = document.createElement('script'); script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'; script.async = true; script.onload = () => window.Tesseract ? resolve(window.Tesseract) : reject(new Error('indisponible')); script.onerror = () => reject(new Error('chargement impossible')); document.head.appendChild(script); }); return ocrLoader; }
  function detectedTotal(text) { const values = [...String(text || '').matchAll(/(?:^|[^0-9])(\d{1,4}(?:[ .]\d{3})*[,.]\d{2})(?:\s*(?:€|eur))?/gi)].map(match => number(match[1].replace(/[ .]/g, ''))).filter(value => Number.isFinite(value) && value >= 0 && value < 10000); return values.at(-1) ?? null; }
  async function readPhoto(file) { const status = document.getElementById('nc-tracker-photo-status'); if (!file || !status) return; status.textContent = 'Pipo lit le ticket…'; try { const Tesseract = await getOcr(); const { data } = await Tesseract.recognize(file, 'fra+eng', { logger: message => { if (message.status === 'recognizing text' && Number.isFinite(message.progress)) status.textContent = `Pipo lit le ticket… ${Math.round(message.progress * 100)} %`; } }); const total = detectedTotal(data.text); if (total === null) { status.textContent = 'Total non détecté : vous pouvez le saisir manuellement.'; return; } const amount = document.getElementById('nc-tracker-amount'); if (amount) amount.value = total.toFixed(2); status.textContent = `Total proposé : ${euro(total)}. Vérifiez-le puis enregistrez vos courses.`; } catch { status.textContent = 'Lecture automatique indisponible : vous pouvez saisir le montant manuellement.'; } }
  document.addEventListener('click', event => { const action = event.target.closest('[data-nc-tracker-action]')?.dataset.ncTrackerAction; if (action) { if (action === 'previous') { shownMonth = monthShift(shownMonth, -1); mount(); } if (action === 'next') { shownMonth = monthShift(shownMonth, 1); mount(); } if (action === 'add') { const amount = number(document.getElementById('nc-tracker-amount')?.value); const date = document.getElementById('nc-tracker-date')?.value; if (!/^\d{4}-\d{2}-\d{2}$/.test(date || '') || !Number.isFinite(amount) || amount <= 0) { const status = document.getElementById('nc-tracker-photo-status'); if (status) status.textContent = 'Ajoutez une date et un montant supérieur à zéro.'; return; } const { root, data } = tracker(); data.records.push({ id:`course-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, date, amount }); writeRoot(root); shownMonth = date.slice(0, 7); mount(); } return; } const id = event.target.closest('[data-nc-tracker-delete]')?.dataset.ncTrackerDelete; if (id) { const { root, data } = tracker(); data.records = data.records.filter(record => String(record.id) !== id); writeRoot(root); mount(); } });
  document.addEventListener('change', event => { if (event.target.id === 'nc-tracker-photo') readPhoto(event.target.files?.[0]); if (event.target.id === 'nc-tracker-target') { const { root, data } = tracker(); const value = number(event.target.value); if (Number.isFinite(value) && value > 0) data.monthlyTargets[shownMonth] = value; else delete data.monthlyTargets[shownMonth]; writeRoot(root); mount(); } });
  window.addEventListener('hashchange', () => window.setTimeout(mount, 25));
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => window.setTimeout(mount, 25), { once:true }); else window.setTimeout(mount, 25);
})();
</script>

<script id="nutrichef-budget-simple-script">
/* Un suivi de dépenses mensuel sans calendrier ni lecture de ticket. */
(() => {
  'use strict';
  const rootKey = () => window.NUTRICHEF_STORAGE_KEY || 'nutrichef-v3';
  const money = value => new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR' }).format(Number(value || 0));
  const asNumber = value => Number(String(value ?? '').trim().replace(',', '.'));
  const today = () => { const date = new Date(); return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`; };
  const month = () => today().slice(0, 7);
  const monthLabel = key => new Intl.DateTimeFormat('fr-FR', { month:'long', year:'numeric' }).format(new Date(`${key}-01T12:00:00`));
  const dateLabel = key => new Intl.DateTimeFormat('fr-FR', { day:'numeric', month:'long' }).format(new Date(`${key}T12:00:00`));
  function readRoot() { try { const root = JSON.parse(localStorage.getItem(rootKey()) || '{}'); return root && typeof root === 'object' ? root : {}; } catch { return {}; } }
  function saveRoot(root) { try { localStorage.setItem(rootKey(), JSON.stringify(root)); return true; } catch { return false; } }
  function tracker() {
    const root = readRoot();
    if (!root.shoppingBudget || typeof root.shoppingBudget !== 'object') root.shoppingBudget = {};
    const data = root.shoppingBudget;
    if (!Array.isArray(data.records)) data.records = [];
    if (!data.monthlyTargets || typeof data.monthlyTargets !== 'object') data.monthlyTargets = {};
    return { root, data };
  }
  function records(data) { const key = month(); return data.records.filter(record => record?.date?.slice(0, 7) === key && Number(record.amount) > 0); }
  function total(items) { return items.reduce((sum, item) => sum + (Number(item.amount) || 0), 0); }
  function page() {
    const { data } = tracker(); const items = records(data); const spent = total(items); const target = asNumber(data.monthlyTargets[month()]); const hasTarget = Number.isFinite(target) && target > 0; const progress = hasTarget ? Math.min(100, Math.round((spent / target) * 100)) : 0; const remaining = hasTarget ? target - spent : 0;
    const history = [...items].sort((a, b) => b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id))).slice(0, 6).map(item => `<div class="budget-simple-history-row"><time datetime="${item.date}">${dateLabel(item.date)}</time><strong>${money(item.amount)}</strong><button type="button" class="budget-simple-remove" data-nc-simple-remove="${String(item.id)}" aria-label="Supprimer ${money(item.amount)}">×</button></div>`).join('');
    return `<div class="wrap budget-simple-shell"><header class="budget-simple-header"><div><h1>Le chef calcule</h1><p class="muted">Un petit geste après les courses, et Pipo suit votre budget.</p></div><img class="budget-simple-pipo" src="assets/pipo-calculatrice-button.png" alt="Pipo avec une calculatrice"></header><p class="budget-simple-month">${monthLabel(month())}</p><div class="budget-simple-grid"><section class="budget-simple-card goal"><span class="budget-simple-step">1. Je choisis</span><h2>Mon budget du mois</h2><p>Combien veux-tu prévoir pour tes courses ?</p><div class="budget-simple-goal-row"><label>Mon budget<input id="nc-simple-target" inputmode="decimal" type="number" min="0" max="9999" step="1" placeholder="Ex. 400" value="${hasTarget ? target : ''}"></label><span>€</span></div><a class="btn secondary budget-simple-list-link" href="#courses">Voir ma liste de courses</a></section><section class="budget-simple-card total"><div class="budget-simple-ring" style="--progress:${progress}%"><div><strong>${progress}%</strong><span>utilisé</span></div></div><div class="budget-simple-total-copy"><strong>${money(spent)}</strong><span>dépensés ce mois</span><span>${hasTarget ? (remaining >= 0 ? `${money(remaining)} disponibles` : `${money(Math.abs(remaining))} dépassés`) : 'Choisis un budget pour commencer'}</span></div></section></div><section class="budget-simple-card add"><span class="budget-simple-step">2. J’ajoute</span><h2>Mes courses d’aujourd’hui</h2><p>Entre simplement le total payé : Pipo l’ajoute automatiquement à ce mois.</p><div class="budget-simple-add-row"><label>J’ai dépensé<input id="nc-simple-amount" inputmode="decimal" type="number" min="0.01" max="9999.99" step="0.01" placeholder="Ex. 90,00"></label><button type="button" data-nc-simple-action="add">Ajouter au suivi</button></div><p id="nc-simple-help" class="budget-simple-help" aria-live="polite"></p></section><section class="budget-simple-card history"><span class="budget-simple-step">3. Je regarde</span><h2>Mes dernières courses</h2><p>Un aperçu rapide pour comprendre où tu en es.</p><div class="budget-simple-history-list">${history || '<p class="budget-simple-empty">Aucune dépense enregistrée ce mois-ci.</p>'}</div></section></div>`;
  }
  function mount() { if ((location.hash.slice(1) || 'accueil') !== 'budget') return; const app = document.getElementById('app'); if (!app) return; app.innerHTML = page(); document.title = 'NutriChef · Le chef calcule'; window.scrollTo(0, 0); }
  document.addEventListener('click', event => { const action = event.target.closest('[data-nc-simple-action]')?.dataset.ncSimpleAction; if (action === 'add') { const amount = asNumber(document.getElementById('nc-simple-amount')?.value); const help = document.getElementById('nc-simple-help'); if (!Number.isFinite(amount) || amount <= 0) { if (help) help.textContent = 'Indique un montant supérieur à zéro.'; return; } const { root, data } = tracker(); data.records.push({ id:`simple-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, date:today(), amount }); saveRoot(root); mount(); return; } const id = event.target.closest('[data-nc-simple-remove]')?.dataset.ncSimpleRemove; if (id) { const { root, data } = tracker(); data.records = data.records.filter(item => String(item.id) !== id); saveRoot(root); mount(); } });
  document.addEventListener('change', event => { if (event.target.id !== 'nc-simple-target') return; const { root, data } = tracker(); const value = asNumber(event.target.value); if (Number.isFinite(value) && value > 0) data.monthlyTargets[month()] = value; else delete data.monthlyTargets[month()]; saveRoot(root); mount(); });
  window.addEventListener('hashchange', () => window.setTimeout(mount, 55));
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => window.setTimeout(mount, 55), { once:true }); else window.setTimeout(mount, 55);
})();
</script>

<script id="nutrichef-hero-go-script">
/* Le bouton rond défile vers les trois choix sans changer de page. */
(() => {
  function prepareChoices() {
    if ((location.hash.slice(1) || 'accueil') !== 'accueil') return;
    const app = document.getElementById('app');
    const button = app?.querySelector('section.hero .cta');
    const choices = app?.querySelector('.home-shortcuts');
    if (!button || !choices) return;
    choices.id = 'choix-recettes';
    button.classList.add('nc-go-choices');
    button.href = '#choix-recettes';
    button.removeAttribute('data-action');
    button.dataset.ncGoChoices = 'true';
    button.setAttribute('aria-label', 'Voir les trois choix de recettes');
    button.textContent = 'GO';
  }
  document.addEventListener('click', event => {
    const button = event.target.closest('[data-nc-go-choices="true"]');
    if (!button) return;
    event.preventDefault();
    document.getElementById('choix-recettes')?.scrollIntoView({ behavior:'smooth', block:'start' });
  });
  // L'accueil est rendu après ce script lors d'une ouverture directe : on attend aussi sa création.
  let pendingFrame = 0;
  const scheduleChoices = () => {
    cancelAnimationFrame(pendingFrame);
    pendingFrame = requestAnimationFrame(prepareChoices);
  };
  const appRoot = document.getElementById('app');
  if (appRoot) new MutationObserver(scheduleChoices).observe(appRoot, { childList:true, subtree:true });
  window.addEventListener('hashchange', () => window.setTimeout(prepareChoices, 60));
  window.addEventListener('load', () => { prepareChoices(); window.setTimeout(prepareChoices, 180); }, { once:true });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => window.setTimeout(prepareChoices, 60), { once:true }); else window.setTimeout(prepareChoices, 60);
})();
</script>

<script id="nutrichef-profile-energy-update">
/*
  Repères de départ transparents : Mifflin–St Jeor pour le métabolisme,
  niveau d'activité pour la dépense. Une perte progressive part d'environ
  500 kcal/jour de moins, soit près de 2 kg/mois en moyenne — jamais garanti.
*/
(() => {
  const LOSS_DEFICIT = 500;
  const MIN_SELF_GUIDED_LOSS_TARGET = 1200;
  const number = value => Math.round(Number(value) || 0);
  const calorieText = value => `${number(value).toLocaleString('fr-FR')} kcal`;

  window.nutrition = function nutritionProfile(p) {
    const age = Number(p?.age);
    const height = Number(p?.height);
    const weight = Number(p?.weight);
    const activity = Number(p?.activity);
    const valid = Number.isFinite(age) && Number.isFinite(height) && Number.isFinite(weight) && Number.isFinite(activity) && height > 0 && weight > 0 && activity > 0;
    const bmi = valid ? weight / (height / 100) ** 2 : 0;
    const bmrRaw = valid ? 10 * weight + 6.25 * height - 5 * age + (p?.sex === 'homme' ? 5 : -161) : 0;
    const tdeeRaw = valid ? bmrRaw * activity : 0;
    const adultRange = age >= 18 && age <= 78;
    const medicalGuard = Boolean(p?.special) || bmi < 18.5 || bmi >= 30;
    const rawTarget = p?.goal === 'perdre' ? tdeeRaw - LOSS_DEFICIT : p?.goal === 'prendre' ? tdeeRaw + 250 : tdeeRaw;
    const lowEnergyGuard = p?.goal === 'perdre' && rawTarget < MIN_SELF_GUIDED_LOSS_TARGET;
    const eligible = valid && adultRange && !medicalGuard && !lowEnergyGuard;
    let restriction = '';
    if (!valid) restriction = 'Complétez votre âge, taille, poids et niveau d’activité pour calculer un repère.';
    else if (!adultRange) restriction = 'Ce repère chiffré est réservé aux adultes de 18 à 78 ans.';
    else if (p?.special) restriction = 'Votre situation déclarée nécessite un repère défini avec un professionnel de santé.';
    else if (bmi < 18.5 || bmi >= 30) restriction = 'Votre IMC appelle un accompagnement professionnel avant de fixer un objectif calorique.';
    else if (lowEnergyGuard) restriction = 'Un déficit de 500 kcal/jour ferait descendre le repère sous 1 200 kcal/jour : un professionnel doit alors personnaliser l’objectif.';
    return {
      bmi,
      bmr: number(bmrRaw),
      tdee: number(tdeeRaw),
      target: eligible ? number(rawTarget) : null,
      eligible,
      restriction,
      goal: p?.goal || 'maintenir',
      activity,
      deficit: p?.goal === 'perdre' ? LOSS_DEFICIT : 0,
      category: bmi < 18.5 ? 'Insuffisance pondérale' : bmi < 25 ? 'Corpulence de référence' : bmi < 30 ? 'Surpoids' : 'Obésité'
    };
  };

  function polishWeekButton() {
    if ((location.hash.slice(1) || 'accueil') !== 'accueil') return;
    const button = document.querySelector('#app .home-week-row .week-cta-full');
    if (!button) return;
    button.textContent = 'Organiser ma recette';
    button.setAttribute('aria-label', 'Organiser ma recette');
  }

  function polishHero() {
    if ((location.hash.slice(1) || 'accueil') !== 'accueil') return;
    const pipo = document.querySelector('#app section.hero .hero-art');
    if (!pipo || pipo.dataset.premiumHero === 'true') return;
    pipo.src = 'assets/pipo-cuisine-premium-v1.png';
    pipo.dataset.premiumHero = 'true';
    pipo.alt = 'Pipo cuisine une recette méditerranéenne dans sa cuisine';
  }

  function polishWizard() {
    if ((location.hash.slice(1) || 'accueil') !== 'profil' || typeof state === 'undefined' || state.profile) return;
    document.querySelectorAll('#app p.muted').forEach(paragraph => {
      if (paragraph.textContent.includes('19 à 78 ans')) paragraph.textContent = 'Les repères chiffrés sont affichés pour les adultes de 18 à 78 ans ; ils restent indicatifs.';
    });
  }

  function explainCalories() {
    if ((location.hash.slice(1) || 'accueil') !== 'profil' || typeof state === 'undefined' || !state.profile) return;
    const n = window.nutrition(state.profile);
    const card = document.querySelector('#app .nc-energy-card');
    if (!card) return;
    const metric = card.querySelector('.metric');
    const lead = card.querySelector('.nc-energy-lead');
    const breakdown = card.querySelector('.nc-energy-breakdown');
    const noTarget = card.querySelector('.nc-no-target');
    card.querySelector('.nc-goal-note, .nc-energy-basis')?.remove();
    if (n.target) {
      if (metric) metric.innerHTML = `≈ ${number(n.target).toLocaleString('fr-FR')} <small>kcal / jour</small>`;
      if (lead) lead.textContent = n.goal === 'perdre'
        ? 'Un repère de départ pour une perte progressive, utilisé pour adapter les recettes et les portions.'
        : n.goal === 'prendre'
          ? 'Un repère de départ pour votre objectif déclaré de prise de poids, utilisé pour adapter les recettes et les portions.'
          : 'Un repère de départ pour maintenir votre poids, utilisé pour adapter les recettes et les portions.';
      if (breakdown) breakdown.innerHTML = `<div><strong>${calorieText(n.bmr)}</strong><span>Métabolisme de base estimé<br>au repos</span></div><div><strong>${calorieText(n.tdee)}</strong><span>Dépense journalière estimée<br>avec votre activité</span></div>`;
      if (noTarget) noTarget.remove();
      const note = document.createElement('p');
      note.className = 'nc-goal-note';
      note.textContent = n.goal === 'perdre'
        ? `Pour la perte de poids, Pipo retire environ ${n.deficit} kcal par jour à votre dépense estimée. Cela correspond en moyenne à près de 2 kg par mois au maximum ; le résultat réel varie selon chaque personne.`
        : n.goal === 'maintenir'
          ? 'Votre objectif correspond à votre dépense journalière estimée : métabolisme de base × niveau d’activité choisi.'
          : 'Votre objectif ajoute une marge progressive à votre dépense journalière estimée.';
      lead?.after(note);
      const basis = document.createElement('p');
      basis.className = 'nc-energy-basis';
      basis.textContent = `Calcul : équation de Mifflin–St Jeor, puis coefficient d’activité ${n.activity.toLocaleString('fr-FR')}. Les calories restent une estimation : elles ne peuvent pas être exactes à la calorie près.`;
      note.after(basis);
    } else {
      if (metric) metric.textContent = 'À définir';
      if (lead) lead.textContent = n.restriction;
      if (breakdown) breakdown.remove();
      if (noTarget) noTarget.textContent = 'Les préférences alimentaires continuent d’être prises en compte pour choisir les recettes.';
    }
    const method = document.querySelector('#app .nc-profile-method');
    if (method) method.innerHTML = `<summary>Comment sont calculés mes repères ?</summary><p>Pour les adultes de 18 à 78 ans sans situation particulière déclarée, NutriChef estime le métabolisme de base avec l’équation de Mifflin–St Jeor, puis applique le niveau d’activité renseigné. C’est une estimation de départ, pas un diagnostic ni une prescription.</p><p>Pour une perte de poids, NutriChef utilise un déficit indicatif de 500 kcal/jour — proche de 2 kg/mois en moyenne. Si cela ferait descendre l’objectif sous 1 200 kcal/jour, aucun objectif automatique n’est proposé.</p><p>Les besoins varient notamment avec l’âge, le sexe, l’activité, la grossesse ou l’allaitement. En cas de maladie, traitement, trouble alimentaire, grossesse/allaitement ou IMC hors repère, demandez un avis professionnel.</p><a href="https://pubmed.ncbi.nlm.nih.gov/2305711/" target="_blank" rel="noopener">Équation de Mifflin–St Jeor</a> · <a href="https://www.who.int/publications/m/item/healthy-diet-factsheet394/" target="_blank" rel="noopener">Repères de l’OMS</a>`;
  }

  let scheduled = 0;
  function updateView() {
    clearTimeout(scheduled);
    scheduled = window.setTimeout(() => { polishWeekButton(); polishHero(); polishWizard(); explainCalories(); }, 0);
  }
  const app = document.getElementById('app');
  if (app) new MutationObserver(updateView).observe(app, { childList: true, subtree: true });
  window.addEventListener('hashchange', () => window.setTimeout(updateView, 80));
  window.addEventListener('load', () => window.setTimeout(() => {
    if (typeof window.render === 'function') window.render();
    updateView();
  }, 140), { once: true });
  window.setTimeout(updateView, 80);
})();
</script>

<script id="nutrichef-recipe-card-update">
/* Présentation compacte des recettes, sans modifier les données ni leur ouverture. */
(() => {
  function upgradeRecipeCards() {
    document.querySelectorAll('#app article.card.recipe:not([data-nc-card="v1"])').forEach(card => {
      const title = card.querySelector('h3')?.textContent.trim() || 'Recette de Pipo';
      const badge = card.querySelector('.badge')?.textContent.trim() || 'La sélection de Pipo';
      const details = card.querySelector('p')?.textContent.trim() || '';
      const kcal = details.match(/(\d+)\s*kcal/i)?.[1] || '—';
      const minutes = details.match(/(\d+)\s*min/i)?.[1] || '—';
      const action = card.querySelector('[data-open]');
      const recipeId = action?.getAttribute('data-open') || '';
      card.dataset.ncCard = 'v1';
      card.classList.add('nc-recipe-card-pro');
      card.innerHTML = `<div class="nc-recipe-head"><span class="nc-recipe-kicker">${badge}</span><h3>${title}</h3></div><div class="nc-recipe-meta" aria-label="Informations de la recette"><span><strong>${kcal}</strong>kcal / 100 g</span><span><strong>100</strong>g</span><span><strong>${minutes}</strong>min</span></div><button class="btn recipe-cta" data-open="${recipeId}">Accéder à la recette</button>`;
    });
  }
  let timer = 0;
  const schedule = () => { clearTimeout(timer); timer = window.setTimeout(upgradeRecipeCards, 0); };
  const app = document.getElementById('app');
  if (app) new MutationObserver(schedule).observe(app, { childList: true, subtree: true });
  window.addEventListener('hashchange', () => window.setTimeout(schedule, 80));
  window.addEventListener('load', () => window.setTimeout(schedule, 150), { once: true });
  schedule();
})();
</script>

<script id="nutrichef-home-pipo-refresh-script">
(() => {
  const pipoImage = 'nutrichef-assets-v2/pipo-accueil-cuisine.png';
  const pipoGreetingImage = 'nutrichef-assets-v2/pipo-accueil-salut-cuillere.png';
  const refreshHome = () => {
    if ((location.hash.slice(1) || 'accueil') !== 'accueil') return;
    const app = document.getElementById('app');
    const hero = app?.querySelector('section.hero');
    const pipo = hero?.querySelector('.hero-art');
    const choices = app?.querySelector('.home-shortcuts');
    if (!hero || !pipo || !choices) return;
    if (pipo.dataset.ncHomePrepared === 'true' && hero.nextElementSibling === choices) return;
    pipo.src = pipoImage;
    pipo.dataset.heySrc = pipoGreetingImage;
    pipo.dataset.talkSrc = pipoImage;
    pipo.alt = 'Pipo, le chef NutriChef, cuisine une recette dans sa casserole';
    hero.querySelector('.cta')?.remove();
    if (hero.nextElementSibling !== choices) hero.after(choices);
    app.querySelector('.intro .week-cta')?.remove();
    choices.querySelector('.card.green')?.setAttribute('href', '#personnalisees');
    pipo.dataset.ncHomePrepared = 'true';
  };
  const schedule = () => [0, 80, 250, 700].forEach(delay => window.setTimeout(refreshHome, delay));
  new MutationObserver(schedule).observe(document.getElementById('app'), { childList: true, subtree: true });
  window.addEventListener('hashchange', schedule);
  window.addEventListener('load', schedule, { once: true });
  schedule();
})();
</script>
<script id="nutrichef-home-choice-navigation">
/* Les cartes de l'accueil gardent un passage direct et fiable vers leur page. */
document.addEventListener('click', event => {
  const card = event.target.closest('#app .home-shortcuts a[href^="#"]');
  if (!card) return;
  const destination = card.getAttribute('href');
  if (!destination) return;
  event.preventDefault();
  event.stopPropagation();
  if (location.hash === destination) window.dispatchEvent(new HashChangeEvent('hashchange'));
  else location.hash = destination;
}, true);
</script>
