<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#315b43">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>NutriChef · Chargement</title>
  <style>
    html,body{min-height:100%;margin:0}body{display:grid;place-items:center;background:#fcfbf7;color:#315b43;font-family:system-ui,sans-serif}
    main{padding:24px;text-align:center}.spin{width:30px;height:30px;margin:0 auto 14px;border:4px solid #dce8d3;border-top-color:#315b43;border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}p{margin:0;font-weight:700}
  </style>
</head>
<body>
  <main aria-live="polite"><div class="spin" aria-hidden="true"></div><p>NutriChef prépare la dernière version…</p></main>
  <script>
    (() => {
      "use strict";
      const fallback = "nutrichef-app-20261018-a.html";
      const hash = location.hash || "#accueil";
      const fail = () => location.replace(fallback + hash);
      fetch("nutrichef-release.json?t=" + Date.now(), { cache: "no-store" })
        .then(response => response.ok ? response.json() : Promise.reject(new Error("release unavailable")))
        .then(release => {
          const entry = typeof release?.entry === "string" && /^[a-z0-9][a-z0-9-]*\.html$/i.test(release.entry)
            ? release.entry
            : fallback;
          location.replace(entry + hash);
        })
        .catch(fail);
    })();
  </script>
</body>
</html>
