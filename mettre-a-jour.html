<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>NutriChef · Mise à jour</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fcfbf7;color:#315b43;font:600 18px system-ui,sans-serif}.card{padding:28px 34px;border:1px solid #dbe4ce;border-radius:20px;background:#fffefa;box-shadow:0 12px 32px #315b4320;text-align:center}.dot{display:inline-block;width:10px;height:10px;margin-right:9px;border-radius:50%;background:#e7ad24;animation:p 1s infinite alternate}@keyframes p{to{transform:scale(.55);opacity:.45}}</style>
</head>
<body>
  <main class="card"><span class="dot"></span>NutriChef installe la dernière version…</main>
  <script>
  (async () => {
    const destination = './index.html?fresh=cache-reset-20261016#accueil';
    try {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map(registration => registration.unregister()));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.filter(key => key.startsWith('nutrichef-')).map(key => caches.delete(key)));
      }
    } catch {}
    location.replace(destination);
  })();
  </script>
</body>
</html>
